[workspace]
resolver = "2"
members = [
    "crates/pangolin-core",
    "crates/ngx",
    "crates/tun",
    "crates/admin",
    "crates/pangolin-cli",
    "tests",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/cnlangzi/pangolin"

# Use our forked pingora with as_http1_mut() patch for WebSocket upgrades
# Branch: pangolin — tracks upstream releases, contains our custom API additions
[patch.crates-io]
pingora = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }
pingora-core = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }
pingora-proxy = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }
pingora-error = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }
pingora-http = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }
pingora-pool = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }
pingora-runtime = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }
pingora-timeout = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }
pingora-lru = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }
pingora-load-balancing = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }
pingora-cache = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }
pingora-header-serde = { git = "https://github.com/cnlangzi/pingora", branch = "pangolin" }

[workspace.dependencies]
# Web framework / proxy
pingora = { version = "0.8", features = ["lb"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
tokio-tungstenite = "0.29"

# WebSocket
futures = "0.3"
futures-util = "0.3"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# TLS / ACME
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
instant-acme = "0.7"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
rmp-serde = "1.3"

# Logging / errors
flate2 = "1.0"

log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# WebSocket (for Sec-WebSocket-Accept computation)
sha1 = "0.10"
base64 = "0.22"

# Test (ACME test server pebble)
wiremock = "0.6"
tempfile = "3"

# Build profile
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
