[workspace]
resolver = "2"
members = [
    "crates/pangolin-core",
    "crates/ngx",
    "crates/tun",
    "crates/admin",
    "crates/api",
    "tests",
]

# The workspace version is a placeholder, not a released version: the
# release workflow writes the pushed tag's version into the
# `[workspace.package]` line below before the build, so the tag is the
# single source of truth for a release's version. See docs/release.md.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/cnlangzi/pangolin"

[workspace.dependencies]
# Web framework / proxy
#
# pingora is consumed from crates.io — the published release, not a
# fork (issue #189). The fork's only patch (`take_stream()`) became
# dead code with the tunnel splice rewrite (issues #153 / #154), and
# a registry dependency is served by the crates.io mirror in
# `build/cargo-mirror.toml` instead of a build-time git fetch.
# See docs/design/pingora-dependency.md for the policy.
pingora = { version = "0.9", features = ["lb"] }
# pingora-core is the lower-level crate behind pingora's own HTTP
# client. Declared without features so the rest of the workspace
# doesn't pick up unwanted TLS backends.
pingora-core = { version = "0.9" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

# WebSocket (issue #39: fastwebsockets replaces tokio-tungstenite,
# permessage-deflate is built-in, zero-copy frame parsing)
fastwebsockets = { version = "0.10", features = ["upgrade"] }

# QUIC transport for the tunnel (issue #153). The primary transport
# carries the tunnel's byte streams over one connection per tun, one
# bidirectional stream per request — and encrypts them by default.
# `platform-verifier` is off: the tun pins the gateway's certificate
# by fingerprint (trust on first use), so it never consults a root
# store.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }

futures-util = "0.3"

# parking_lot::Mutex / RwLock are used in two places:
#   - TLS hot-path (ALPN callback runs in a sync C context, so the
#     per-SNI tunnel-domain mirror must use a sync lock). See
#     `pangolin-core::App::tunnel_domains` and `ngx::tls::build_sni_settings`.
#   - App's in-memory access-log ring buffer (issue #73). Sync,
#     non-poisoning, fast-path acquire — the response_filter hot path
#     holds it for a single VecDeque bound check + push_back.
parking_lot = "0.12"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# TLS / ACME
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
instant-acme = { version = "0.8", features = ["hyper-rustls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Layered config (file + env override), replaces the previous
# hand-rolled `expand_env_vars` + `serde_yaml::from_str` path.
figment = { version = "0.10", features = ["yaml", "env", "toml"] }

# Hashing — issue #39 stores `tun.token` as `sha256(token)` hex (V3 migration).
sha2 = "0.10"

# CIDR parsing / matching for the IP rules (issue #117). The
# knownbots crate already depends on it for its official IP ranges.
ipnet = "2"

# Bot verification (UA + official IP ranges / RDNS) — issue #146. The
# crate is published (github.com/cnlangzi/knownbots-rust), not part
# of this workspace. The `full` feature compiles in the IP-list
# download and the RDNS workers; without it every URL-backed bot
# would stay `Cold`.
#
# 0.3.0 is the floor (issue #157): its transport repeats a refused
# download over the other address family and remembers the family
# that delivered the list, so a tampered IPv6 path to a publisher can
# no longer starve a crawler of its address list — 0.2.0 left the
# address order to the system resolver, which hands back the AAAA
# record first (upstream issue #57).
knownbots = { version = "0.3.0", features = ["full"] }

# IP reputation (issue #141). The `full` feature compiles in every
# provider the crate ships: the five list publishers (Spamhaus,
# DShield, Blocklist.de, steeman, CINS Army) and the two keyed lookup
# providers (AbuseIPDB, CrowdSec). A provider is only *queried* when
# the gateway enables it — see `pangolin_core::badbots`.
badbots = { version = "0.1.4", features = ["full"] }

# The tunnel's wire protocol and its client (issue #159). The crate is
# published (github.com/cnlangzi/pangolin-tun), not part of this
# workspace: the protocol, the two transports, the TOFU pin store and
# the client all live there, and this repository consumes them from
# the registry the way it consumes `knownbots` and `badbots`.
#
# The requirement is a caret on the 0.1 line — a future 0.2 release
# would carry a protocol change, so it must not be picked up silently.
#
# The crate pins `base64 0.23` and `thiserror 2` while this workspace
# asks for `base64 0.22` and `thiserror 1`, so the tree carries two
# copies of each. The duplication is harmless: none of the crate's
# public API is a `base64` or a `thiserror` type, so the two copies
# never meet at a type boundary. Aligning the workspace on the
# crate's versions would remove the duplication but is a workspace-wide
# change that belongs in its own pull request.
pangolin-tun = { version = "0.1" }

log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"

# MIME + HTTP date helpers (used by pangolin-core::file_serve)
mime_guess = "2"
httpdate = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# WebSocket (for Sec-WebSocket-Accept computation)
sha1 = "0.10"
base64 = "0.22"
# Hex encoding — the token digests, the key fingerprints.
hex = "0.4"

# Test (ACME test server pebble)
wiremock = "0.6"
tempfile = "3"

# DashMap is the concurrent hashmap behind CertLinkCache (issue:
# fix/cert_www). The SNI callback's hot path reads under
# contention from N handshake tasks; DashMap's per-shard
# locking gives us lock-free reads in the common case without
# us building a sharded map by hand.
dashmap = "6"


# Build profile
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
