[workspace]
resolver = "2"
members = [
    "crates/pangolin-core",
    "crates/ngx",
    "crates/tun",
    "crates/admin",
    "crates/pangolin-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/cnlangzi/pangolin"

[workspace.dependencies]
# Web framework / proxy
pingora = { version = "0.8", features = ["lb"] }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"

# WebSocket
futures = "0.3"
futures-util = "0.3"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# TLS / ACME
rcgen = "0.14"
instant-acme = "0.7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Logging / errors
log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Test (ACME test server pebble)
wiremock = "0.6"

# Build profile
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
