[workspace]
resolver = "2"
members = [
    "crates/pangolin-core",
    "crates/ngx",
    "crates/tun",
    "crates/admin",
    "crates/api",
    "tests",
]

# The workspace version is a placeholder, not a released version: the
# release workflow writes the pushed tag's version into the
# `[workspace.package]` line below before the build, so the tag is the
# single source of truth for a release's version. See docs/release.md.
[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
repository = "https://github.com/cnlangzi/pangolin"

[workspace.dependencies]
# Web framework / proxy
#
# pingora is consumed from crates.io — the published release, not a
# fork (issue #189). The fork's only patch (`take_stream()`) became
# dead code with the tunnel splice rewrite (issues #153 / #154), and
# a registry dependency is served by the crates.io mirror in
# `build/cargo-mirror.toml` instead of a build-time git fetch.
# See docs/design/pingora-dependency.md for the policy.
pingora = { version = "0.9", features = ["lb"] }
# pingora-core is the lower-level crate behind pingora's own HTTP
# client. Declared without features so the rest of the workspace
# doesn't pick up unwanted TLS backends. `crates/ngx` names the same
# line directly (it needs the crate for the protocol types and the
# `pingora-openssl` helpers), so the two have to be bumped together —
# `tests/src/pingora_dependency.rs` pins that.
pingora-core = { version = "0.9" }
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

# WebSocket (issue #39: fastwebsockets replaces tokio-tungstenite,
# permessage-deflate is built-in, zero-copy frame parsing)
fastwebsockets = { version = "0.10", features = ["upgrade"] }

# QUIC transport for the tunnel (issue #153). The primary transport
# carries the tunnel's byte streams over one connection per tun, one
# bidirectional stream per request — and encrypts them by default.
# `platform-verifier` is off: the tun pins the gateway's certificate
# by fingerprint (trust on first use), so it never consults a root
# store.
quinn = { version = "0.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
    "log",
] }

futures-util = "0.3"

# parking_lot::Mutex / RwLock are used in two places:
#   - TLS hot-path (the ALPN callback runs in a sync C context, so the
#     routing revision it classifies the SNI against and the per-tun
#     transport map it reads must use sync locks). See
#     `pangolin-core::App::tunnel_classification`,
#     `pangolin-core::App::tun_kind` and `crates/ngx/src/tls.rs`.
#   - App's in-memory access-log ring buffer (issue #73). Sync,
#     non-poisoning, fast-path acquire — the response_filter hot path
#     holds it for a single VecDeque bound check + push_back.
parking_lot = "0.12"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# TLS / ACME
rustls = { version = "0.23.40", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
instant-acme = { version = "0.8", features = ["hyper-rustls"] }

# Serialization
#
# The `rc` feature teaches serde to (de)serialize `Arc<T>` as `T`.
# The access log hands out `Arc<AccessLogEntry>` (issue #224) and the
# API still has to render the same JSON as before.
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
serde_yaml = "0.9"

# Layered config (file + env override), replaces the previous
# hand-rolled `expand_env_vars` + `serde_yaml::from_str` path.
figment = { version = "0.10", features = ["yaml", "env", "toml"] }

# Hashing — issue #39 stores `tun.token` as `sha256(token)` hex (V3 migration).
#
# 0.11 is the digest-0.11 ecosystem (issue #200): the output type moved
# from generic-array to hybrid-array's `Array`, and `hmac 0.13` needs
# the matching `EagerHash` implementations.  Every crate in *this*
# workspace takes the hash crates from here, so our own code sits on
# one version and never straddles the two digest ecosystems.
#
# The lock file still carries a `digest 0.10` alongside `digest 0.11`,
# but every edge into it is a third-party crate we do not control:
# `pangolin-tun 0.3` (published), `fastwebsockets 0.10` and
# `tungstenite 0.24` (sha1 0.10), `rust-embed-utils 8.11` (sha2
# 0.10) and `pingora-cache`'s `blake2 0.10` (digest 0.10).  The two
# `digest` versions never meet at a type boundary here — no public
# API of ours mentions a digest type.
sha2 = "0.11"

# CIDR parsing / matching for the IP rules (issue #117). The
# knownbots crate already depends on it for its official IP ranges.
ipnet = "2"

# Bot verification (UA + official IP ranges / RDNS) — issue #146. The
# crate is published (github.com/cnlangzi/knownbots-rust), not part
# of this workspace. The `full` feature compiles in the IP-list
# download and the RDNS workers; without it every URL-backed bot
# would stay `Cold`.
#
# 0.3.0 raised the floor (issue #157): its transport repeats a refused
# download over the other address family and remembers the family
# that delivered the list, so a tampered IPv6 path to a publisher can
# no longer starve a crawler of its address list — 0.2.0 left the
# address order to the system resolver, which hands back the AAAA
# record first (upstream issue #57). 0.4.0 keeps that behaviour.
#
# 0.4.0 (issue #230) owns the category vocabulary: the crate states the
# coarse bucket of a crawler in its own definition and publishes the
# `BotCategory` type with the wire labels. The labels are a published
# contract, so the host consumes them instead of keeping a second copy
# that could drift away from the one the JSONL rows carry.
#
# 0.4.0 also makes `category:` a REQUIRED field of every bot
# definition, an operator's `<log.bot.cache_dir>/conf.d/` one
# included: a file without one is skipped and reported, and the
# crawler in it is never verified. The gateway logs the skipped files
# at startup. See docs/design/knownbots.md ("The 0.4 category change").
knownbots = { version = "0.4.0", features = ["full"] }

# IP reputation (issue #141). The `full` feature compiles in every
# provider the crate ships: the five list publishers (Spamhaus,
# DShield, Blocklist.de, steeman, CINS Army) and the two keyed lookup
# providers (AbuseIPDB, CrowdSec). A provider is only *queried* when
# the gateway enables it — see `pangolin_core::badbots`.
badbots = { version = "0.1.4", features = ["full"] }

# The tunnel's wire protocol and its client (issue #159). The crate is
# published (github.com/cnlangzi/pangolin-tun), not part of this
# workspace: the protocol, the two transports, the TOFU pin store and
# the client all live there, and this repository consumes them from
# the registry the way it consumes `knownbots` and `badbots`.
#
# The requirement is a caret on the 0.3 line (issue #232). 0.2.0 was
# already published under issue #211, and crates.io does not let a
# version be published twice, so the constructor could not ship on the
# 0.2 line: the release that carries it is 0.3.0.
#
# 0.3.0 is the release that adds `bind_endpoint_with_socket`: the QUIC
# endpoint can be built on a socket the caller bound itself, so the
# caller can set `SO_REUSEPORT` *before* the bind — which is what a
# handover between two generations of the gateway needs, because the
# outgoing generation still holds the port. The gateway keeps using the
# crate's own `bind_endpoint` for now; the caller-bindable constructor
# is the capability the handover will rest on.
#
# 0.2.0 (issue #211) is the release that binds the session-end signal
# to the streams of the WebSocket/TCP transport: a dying tunnel
# session now reads as an error instead of as a clean end-of-file, so
# the tun closes the backend socket with an error instead of handing
# it a truncated request. The change is a **Rust API** change —
# `open_stream()` and `accept_stream()` return the crate's own stream
# wrapper instead of `yamux::StreamHandle` — and it stays behind the
# `TunnelTransport` trait, so no source file here had to change. The
# *wire* protocol is untouched across both releases:
# `TUNNEL_PROTOCOL_VERSION` stays 2, and a gateway and a tun that were
# not upgraded together still interoperate.
#
# The crate pins `thiserror 2` while this workspace asks for
# `thiserror 1`, so the tree carries two copies of it. The
# duplication is harmless: none of the crate's public API is a
# `thiserror` type, so the two copies never meet at a type boundary.
# Aligning the workspace on the crate's version would remove the
# duplication but is a workspace-wide change that belongs in its own
# pull request.
pangolin-tun = { version = "0.3" }

log = "0.4"
env_logger = "0.11"
anyhow = "1"
thiserror = "1"

# MIME + HTTP date helpers (used by pangolin-core::file_serve)
mime_guess = "2"
httpdate = "1"

# Time
chrono = { version = "0.4", features = ["serde"] }

# CLI
clap = { version = "4", features = ["derive"] }

# WebSocket (for Sec-WebSocket-Accept computation)
sha1 = "0.11"
base64 = "0.23"
# Hex encoding — the token digests, the key fingerprints.
hex = "0.4"

# Test (ACME test server pebble)
wiremock = "0.6"
tempfile = "3"

# DashMap is the concurrent hashmap behind CertLinkCache (issue:
# fix/cert_www). The SNI callback's hot path reads under
# contention from N handshake tasks; DashMap's per-shard
# locking gives us lock-free reads in the common case without
# us building a sharded map by hand.
dashmap = "6"


# Build profile
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
