# cargo configuration for the Docker build environment.
#
# This file is COPY'd into /usr/local/cargo/config.toml by dist.dockerfile,
# so it only takes effect inside the container — local dev on macOS / Linux
# is unaffected.
#
# Two performance wins, all standard Rust+Docker recipes:
#
#  1. mold is a drop-in replacement for ld that is 2-5× faster on debug
#     links and dramatically faster on release LTO links.  We invoke it
#     through clang's `-fuse-ld=mold` flag, which is the standard recipe
#     in the Rust performance guide.
#
#  2. Registry mirror — primary is rsproxy.cn (Rust 中文社区镜像, fastest
#     from CN networks).  This affects BOTH direct `crates-io` deps and
#     transitive deps pulled in via git-source forks (e.g. our
#     `cnlangzi/pingora` branch declares deps that re-resolve through
#     crates-io).  Override on the command line with --config or
#     CARGO_REGISTRIES_* env vars when building from outside China.
#
#     Mirror list (swap by editing `replace-with` + the registry name):
#       sjtu         sparse+https://mirrors.sjtug.sjtu.edu.cn/crates.io-index/
#       ustc         sparse+https://mirrors.ustc.edu.cn/crates.io-index/
#       tuna         sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/
#       rsproxy.cn   sparse+https://rsproxy.cn/index/
#       bytecode     https://mirrors.bytecode.cn/crates.io-index/  (often unreachable)
#
# The compiler cache is NOT configured here.  sccache is wired up by the
# CARGO_BUILD_RUSTC_WRAPPER / SCCACHE_* environment variables in
# dist.dockerfile, because that file is copied before the sccache binary
# exists — a wrapper pointing at a missing binary breaks the build's own
# `cargo install` step.  The sccache cache lives in the BuildKit cache
# mount on /root/.cache/sccache; the bulk of the compilation reuse comes
# from the /pangolin/target cargo cache mount.  Both survive across
# `docker build` runs on the same machine — CI never runs Docker, so
# there is no cache to share with the pipeline.

[target.x86_64-unknown-linux-gnu]
linker = "clang"
rustflags = ["-C", "link-arg=-fuse-ld=mold"]


[net]
# Faster git fetches for git-source dependencies (e.g. the forked
# `pingora` declared in the workspace [patch.crates-io] section).
git-fetch-with-cli = true

# More attempts before a download is given up on.  The mirror below
# stalls intermittently; cargo's default of 3 is not enough to get a
# few hundred crates through.
retry = 10

[http]
# The crates.io mirror this build resolves through (sjtu, redirecting to
# s3.jcloud.sjtu.edu.cn) intermittently stalls mid-transfer, and cargo
# gives up on the whole build with
#
#   transfer too slow: failed to transfer more than 10 bytes in 30s
#
# The failure hits *batches* of downloads at once, because cargo
# multiplexes them over a single HTTP/2 connection: one stalled stream
# stalls every other download sharing it.  Relax cargo's defaults so a
# slow transfer costs a retry instead of the build:
#
#   multiplexing     — one HTTP/1.1 connection per download, so a stalled
#                     stream cannot block the others.
#   timeout          — per-request ceiling; cargo's default aborts
#                     long downloads on a slow link.
#   low-speed-limit  — don't abort a download that trickles along.
multiplexing = false
timeout = 600
low-speed-limit = 1

[registries.crates-io]
# Replace the default crates.io endpoint.  `replace-with` makes every
# `crates-io` reference (including transitive dependencies, even those
# pulled in via git-source forks like our `cnlangzi/pingora` branch)
# go through the mirror configured below.
#
# IMPORTANT: the registry named below MUST be defined in this file,
# otherwise cargo silently falls back to the default crates.io and
# the build may hit network timeouts in CN networks.  See the
# "mirror selection" section at the top of this file.
#
# Verified reachable on 2026-06-15 (see docs on mirror selection):
#   sjtu  ~1.7 MB/s  (fastest)
#   ustc  ~900 KB/s
#   tuna  ~150 KB/s
#   rsproxy varies (sometimes drops to KB/s)
#   bytecode DNS unresolvable from this network
replace-with = "sjtu"

[registries.rsproxy]
index = "sparse+https://rsproxy.cn/index/"

[registries.ustc]
index = "sparse+https://mirrors.ustc.edu.cn/crates.io-index/"

[registries.tuna]
index = "sparse+https://mirrors.tuna.tsinghua.edu.cn/crates.io-index/"

[registries.bytecode]
index = "sparse+https://mirrors.bytecode.cn/crates.io-index/"

[registries.sjtu]
index = "sparse+https://mirrors.sjtug.sjtu.edu.cn/crates.io-index/"
