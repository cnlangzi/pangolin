---
# The .env → Ansible bridge lives in the parent playbook's `vars:`
# block (`deploy/playbooks/tun.yml`), not here. `vars:` is a play-
# level keyword and is not allowed inside a task file.
#
# Upload first, restart last — old binary keeps serving through
# the upload, downtime is a single restart. Binary gets a single
# rolling `.bak`, not a timestamped stack.

- name: Check if pangolin user exists
  # The pangolin user is shared with the ngx role. On a host that
  # already runs ngx, that user is held by the `pangolin-ngx`
  # process — calling `usermod` against it (e.g. to align home or
  # shell) would fail. So we only create it if it's missing, and we
  # do not try to align any attributes; the systemd unit's `User=`
  # and `WorkingDirectory=` are what actually control service
  # execution, the passwd fields are irrelevant.
  ansible.builtin.getent:
    database: passwd
    key: pangolin
  # `getent` returns success even when the key is missing — the
  # only signal is `ansible_facts.getent_passwd` not containing
  # the user. `failed_when: false` is kept so a transport error
  # doesn't mask the lookup; the `when:` below does the actual
  # existence check.
  failed_when: false
  changed_when: false

- name: Create pangolin user (only if absent)
  become: true
  user:
    name: pangolin
    state: present
    system: yes
  when: "'pangolin' not in (ansible_facts.getent_passwd | default({}))"

- name: Create workdir
  become: true
  file:
    path: /usr/local/pangolin
    state: directory
    owner: pangolin
    group: pangolin
    mode: 0755

- name: Backup existing tun binary to .bak
  ansible.builtin.include_tasks: ../../common/tasks/backup-rolling-binary.yml
  vars:
    binary_name: pangolin-tun

- name: Upload tun binary
  become: true
  copy:
    src: "{{ playbook_dir }}/../../build/output/pangolin-tun"
    dest: /usr/local/pangolin/pangolin-tun
    owner: pangolin
    group: pangolin
    mode: 0755
  notify: restart tun

- name: Upload tun config
  become: true
  template:
    src: tun.yml.j2
    dest: /usr/local/pangolin/tun.yml
    owner: pangolin
    group: pangolin
    mode: 0600
  notify: restart tun

- name: Upload tun systemd service
  become: true
  copy:
    src: tun.service
    dest: /etc/systemd/system/pangolin-tun.service
  notify:
    - reload systemd
    - restart tun

- name: Enable tun service
  # Boot-time enable only; the trailing `restart tun` handler is
  # the single source of truth for "start the service" — both
  # fresh install and binary refresh route through it. This task
  # intentionally has no `state:` so an idempotent no-op deploy
  # doesn't silently start a service the operator left down.
  ansible.builtin.systemd:
    name: pangolin-tun
    enabled: true
    masked: no
