---
# The .env → Ansible bridge lives in the parent playbook's `vars:`
# block (`deploy/playbooks/tun.yml`), not here. `vars:` is a play-
# level keyword and is not allowed inside a task file.
#
# Deploy order: upload first, restart last. Old code stopped the
# service up front and re-started it after the upload, so downtime
# was "stop + upload (tens of MB) + start". Linux lets you
# overwrite an executable that a running process has mmap'd, so
# the new order leaves the old binary running through the upload
# and the trailing `restart` handler is the only thing that flips
# to it — downtime collapses to a single sub-second restart. The
# WebSocket reconnect to ngx is fast enough that callers don't
# notice.
#
# Backup: single rolling `.bak` (overwriting any prior one)
# instead of `copy: backup: yes`'s timestamped stack. The `stat`
# + `copy` pair backs up only when the binary already exists —
# first deploy is a clean copy with no backup.

- name: Check if pangolin user exists
  # The pangolin user is shared with the ngx role. On a host that
  # already runs ngx, that user is held by the `pangolin-ngx`
  # process — calling `usermod` against it (e.g. to align home or
  # shell) would fail. So we only create it if it's missing, and we
  # do not try to align any attributes; the systemd unit's `User=`
  # and `WorkingDirectory=` are what actually control service
  # execution, the passwd fields are irrelevant.
  ansible.builtin.getent:
    database: passwd
    key: pangolin
  # `getent` returns success even when the key is missing — the
  # only signal is `ansible_facts.getent_passwd` not containing
  # the user. `failed_when: false` is kept so a transport error
  # doesn't mask the lookup; the `when:` below does the actual
  # existence check.
  failed_when: false
  changed_when: false

- name: Create pangolin user (only if absent)
  become: true
  user:
    name: pangolin
    state: present
    system: yes
  when: "'pangolin' not in (ansible_facts.getent_passwd | default({}))"

- name: Create workdir
  become: true
  file:
    path: /usr/local/pangolin
    state: directory
    owner: pangolin
    group: pangolin
    mode: 0755

- name: Stat existing tun binary
  # Used to skip the backup step on a fresh install — the binary
  # may not exist yet on the very first deploy, in which case
  # there is nothing to back up.
  become: true
  ansible.builtin.stat:
    path: /usr/local/pangolin/pangolin-tun
  register: tun_binary_stat

- name: Backup existing tun binary to pangolin-tun.bak
  # `remote_src: yes` reads from the managed host, and `force` is
  # on by default, so any prior `.bak` is overwritten — disk
  # holds exactly one previous version. Roll back by hand with
  # `cp pangolin-tun.bak pangolin-tun && systemctl restart pangolin-tun`.
  become: true
  ansible.builtin.copy:
    src: /usr/local/pangolin/pangolin-tun
    dest: /usr/local/pangolin/pangolin-tun.bak
    remote_src: yes
    owner: pangolin
    group: pangolin
    mode: 0755
  when: tun_binary_stat.stat.exists

- name: Upload tun binary
  become: true
  copy:
    src: "{{ playbook_dir }}/../../build/output/pangolin-tun"
    dest: /usr/local/pangolin/pangolin-tun
    owner: pangolin
    group: pangolin
    mode: 0755
  notify: restart tun

- name: Upload tun config
  become: true
  template:
    src: tun.yml.j2
    dest: /usr/local/pangolin/tun.yml
    owner: pangolin
    group: pangolin
    mode: 0600
  notify: restart tun

- name: Upload tun systemd service
  become: true
  copy:
    src: tun.service
    dest: /etc/systemd/system/pangolin-tun.service
  notify:
    - reload systemd
    - restart tun

- name: Enable tun service
  # Boot-time enable only; the trailing `restart tun` handler is
  # the single source of truth for "start the service" — both
  # fresh install and binary refresh route through it. This task
  # intentionally has no `state:` so an idempotent no-op deploy
  # doesn't silently start a service the operator left down.
  ansible.builtin.systemd:
    name: pangolin-tun
    enabled: true
    masked: no
