---
# The .env → Ansible bridge lives in the parent playbook's `vars:`
# block (`deploy/playbooks/ngx.yml`), not here. `vars:` is a play-
# level keyword and is not allowed inside a task file.
- name: Snapshot ngx service state
  # On a re-deploy the existing `pangolin-ngx` process is owned by
  # the pangolin user, which makes `usermod` fail with
  # "user pangolin is currently used by process N". Stop ngx first;
  # the final task re-enables and starts it. We deliberately do NOT
  # touch `pangolin-tun` — each role manages its own service.
  become: true
  ansible.builtin.systemd:
    name: pangolin-ngx
  register: ngx_service
  failed_when: false

- name: Stop ngx service if active
  become: true
  ansible.builtin.systemd:
    name: pangolin-ngx
    state: stopped
  when: ngx_service.status is defined and ngx_service.status.ActiveState == 'active'

- name: Check if pangolin user exists
  # The pangolin user is shared with the tun role. On a host that
  # already runs tun, that user is held by the `pangolin-tun`
  # process — calling `usermod` against it (e.g. to align home or
  # shell) would fail. So we only create it if it's missing, and we
  # do not try to align any attributes; the systemd unit's `User=`
  # and `WorkingDirectory=` are what actually control service
  # execution, the passwd fields are irrelevant.
  ansible.builtin.getent:
    database: passwd
    key: pangolin
  register: pangolin_user
  failed_when: false
  changed_when: false

- name: Create pangolin user (only if absent)
  become: true
  user:
    name: pangolin
    state: present
    system: yes
  when: pangolin_user is failed

- name: Create workdir
  become: true
  file:
    path: /usr/local/pangolin
    state: directory
    owner: pangolin
    group: pangolin
    mode: 0755

- name: Create data directory
  become: true
  file:
    path: /usr/local/pangolin/data
    state: directory
    owner: pangolin
    group: pangolin
    mode: 0755

- name: Create certs directory
  become: true
  file:
    path: /usr/local/pangolin/certs
    state: directory
    owner: pangolin
    group: pangolin
    mode: 0755

- name: Upload ngx binary
  become: true
  copy:
    src: "{{ playbook_dir }}/../../build/output/pangolin-ngx"
    dest: /usr/local/pangolin/pangolin-ngx
    owner: pangolin
    group: pangolin
    mode: 0755
    backup: yes
  notify: restart ngx

- name: Upload ngx config
  become: true
  template:
    src: ngx.yml.j2
    dest: /usr/local/pangolin/ngx.yml
    owner: pangolin
    group: pangolin
    mode: 0644
  notify: restart ngx

- name: Upload ngx systemd service
  become: true
  copy:
    src: ngx.service
    dest: /etc/systemd/system/pangolin-ngx.service
  notify:
    - reload systemd
    - restart ngx

- name: Enable ngx service
  ansible.builtin.systemd:
    name: pangolin-ngx
    enabled: true
    masked: no
    state: started