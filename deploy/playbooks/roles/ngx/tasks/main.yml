---
# The .env → Ansible bridge lives in the parent playbook's `vars:`
# block (`deploy/playbooks/ngx.yml`), not here. `vars:` is a play-
# level keyword and is not allowed inside a task file.
- name: Create pangolin user
  become: true
  user:
    name: pangolin
    system: yes
    shell: /usr/sbin/nologin
    home: /usr/local/pangolin
    create_home: no
    comment: "Pangolin Gateway Service User"

- name: Create workdir
  become: true
  file:
    path: /usr/local/pangolin
    state: directory
    owner: pangolin
    group: pangolin
    mode: 0750

- name: Create data directory
  become: true
  file:
    path: /usr/local/pangolin/data
    state: directory
    owner: pangolin
    group: pangolin
    mode: 0750

- name: Create certs directory
  become: true
  file:
    path: /usr/local/pangolin/certs
    state: directory
    owner: pangolin
    group: pangolin
    mode: 0700

- name: Upload ngx binary
  become: true
  copy:
    src: "{{ playbook_dir }}/../../build/output/pangolin-ngx"
    dest: /usr/local/pangolin/pangolin-ngx
    owner: pangolin
    group: pangolin
    mode: 0755
    backup: yes
  notify: restart ngx

- name: Upload ngx config
  become: true
  template:
    src: ngx.yml.j2
    dest: /usr/local/pangolin/ngx.yml
    owner: pangolin
    group: pangolin
    mode: 0644
  notify: restart ngx

- name: Upload ngx systemd service
  become: true
  copy:
    src: ngx.service
    dest: /etc/systemd/system/pangolin-ngx.service
  notify:
    - reload systemd
    - restart ngx

- name: Enable ngx service
  ansible.builtin.systemd_service:
    name: pangolin-ngx
    enabled: true
    masked: no
    state: started