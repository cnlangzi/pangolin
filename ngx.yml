# pangolin-ngx config (auto-loaded because the binary's --config
# default is `ngx.yml`).
#
# The top level of this file IS the proxy config — there is no
# `proxy:` wrapper. The `[tunnel]` sub-section is the endpoint that tun
# clients connect into. Other features (admin UI, ACME certs, logging)
# each have their own sub-section.
#
# Every field is optional — all sections have `#[serde(default)]` in
# crates/pangolin-core/src/config.rs. This file lists every field the
# gateway acts on, plus the inert ones named below, so that:
#   (a) schema drift is visible: a field the code stops reading has to
#       be removed here too, not only in the Rust source;
#   (b) new contributors see all knobs without reading the Rust source
#
# Some keys are accepted by the loader but NOT implemented by the
# gateway. A configuration that carries them parses fine and nothing
# happens:
#   * the `cache` section — there is no response cache in the gateway;
#   * `tunnel.tls_cert` / `tunnel.tls_key` — the tunnel listener is a
#     plain TCP socket. The encrypted path is QUIC, which uses its own
#     certificate under `acme.cert_dir`;
#   * `tunnel.ws_path` — the gateway hardcodes the `/tunnel` upgrade
#     path, so a different value changes nothing;
#   * the top-level `host` and `workers` — the TLS listener is
#     SNI-based (it resolves a certificate through the pre-computed
#     domain → cert link, not through a virtual host), and the worker
#     count is chosen by the runtime.
# The `cache` section and the two tunnel TLS keys are therefore left
# out of this file; `ws_path`, `host` and `workers` are listed below
# so the schema stays visible, but nothing reads them.
#
# Environment-variable override: any NGX_<KEY> env var wins over the
# matching YAML path, with `__` as the nested-key separator. Examples:
#   NGX_ADDR__HTTP=":8080"      # overrides `addr.http`
#   NGX_ADDR__HTTPS=":0"        # disable TLS
#   NGX_ADMIN__PASSWORD=secret  # override admin password
#   NGX_LOG__LEVEL=warn         # override log level
#   NGX_ACME__CERT_DIR=/etc/certs
# The loader is figment-based, so env override is value-level — the
# YAML text is never re-scanned for `$VAR` placeholders.
#
# Dev ports are non-privileged (8000/8443) so `make start-ngx` works
# without sudo. Production defaults are 0.0.0.0:80 / 0.0.0.0:443
# (privileged) — see
# https://github.com/cnlangzi/pangolin/blob/main/docs/configuration.md
# for the per-field documentation.
#
# ── TLS setup for local dev ──────────────────────────────────────────────
# In v2 there is no `default` blob fallback — each host you serve TLS
# for needs its own blob at `./certs/{host}` (or `./certs/{host}+rsa`).
# Easiest dev setup: use SNI to a single cert for everything. Generate
# one for `localhost` with:
#
#   mkdir -p ./certs
#   openssl req -x509 -newkey rsa:2048 -nodes \
#     -keyout ./certs/localhost \
#     -out ./certs/localhost \
#     -days 365 -subj "/CN=localhost"
#   (Note: the cert is a *combined* key+cert blob, not a dir.)
#
# For HTTP-only dev, set `addr.https` to ":0" below.
# ─────────────────────────────────────────────────────────────────────────

# ── Proxy listen (top level: this file IS the proxy config) ──────────────
# Full host:port strings. The Rust defaults are 0.0.0.0:8000 +
# 0.0.0.0:8443 so a fresh-clone `make start-ngx` works without
# sudo. Production hosts that bind the privileged ports override
# to 0.0.0.0:80 / 0.0.0.0:443 here (or via NGX_ADDR__HTTP /
# NGX_ADDR__HTTPS env vars).
addr:
  http: 0.0.0.0:8000    # HTTP listen addr
  https: 0.0.0.0:8443   # HTTPS listen addr; ":0" = disable TLS entirely
host: null              # Accepted, but NOT read by the gateway: it used
                        # to name the virtual host that resolved the
                        # per-domain certificate. Since v2 the TLS
                        # listener is SNI-based and resolves a
                        # certificate through the pre-computed
                        # domain → cert link, so there is no virtual
                        # host any more. Setting it changes nothing.
workers: null           # Accepted, but NOT read by the gateway: the
                        # worker count is chosen by the runtime, not by
                        # the configuration. Setting it changes nothing.

# ── Endpoint for tun clients ─────────────────────────────────────────────
# Two transports carry the same protocol:
#   * QUIC — the primary transport. It listens on the **same port
#     number** as the tunnel's `addr` key, but over **UDP** (TCP and
#     UDP have separate port spaces, so no extra key is needed). A
#     firewall rule that opens the TCP port has to open the UDP port
#     too. The gateway generates the QUIC certificate under
#     `{acme.cert_dir}/tunnel/` and logs its SHA-256 fingerprint at
#     startup.
#   * WebSocket over TCP — the fallback for networks that block UDP.
#     It is **not encrypted**: the listener is a plain TCP socket, so
#     the tun's bearer token crosses the network in clear text in the
#     `Authorization` header of the upgrade request. Keep the tunnel
#     port on a trusted network, or pin the tun to QUIC with
#     `transport: quic` in tun.yml.
tunnel:
  addr: 0.0.0.0:9001    # listen addr (full host:port). Default
                        # `0.0.0.0:9001` accepts tun clients on any
                        # interface (the normal multi-host deploy).
                        # Override to `127.0.0.1:9001` if you want
                        # to force tun-on-this-host-only semantics.
  ws_path: /tunnel      # WebSocket path. Accepted, but NOT read by the
                        # gateway: the tunnel upgrade path is
                        # hardcoded to `/tunnel`, so a different value
                        # changes nothing. A reverse proxy in front of
                        # this port has to rewrite the path to
                        # `/tunnel`.

admin:
  addr: 0.0.0.0:9081    # admin UI/API bind addr. Default `0.0.0.0:9081`
                        # accepts remote admin (e.g. via SSH port
                        # forward). Set the password directly in
                        # this file; restrict access via ufw/iptables
                        # if exposing to a non-trusted network.
  username: admin
  password: admin       # the shipped default is `admin` — change it
                        # before the admin port is reachable from an
                        # untrusted network. The gateway logs no
                        # warning about it, so this file is the only
                        # place the operator is told.

api:
  listen: 0.0.0.0:9443  # the dashboard-facing management API (issue
                        # #185) — its own listener, its own `/api/v1/`
                        # namespace, its own authentication. Set it to
                        # ":0" to not listen at all.
                        #
                        # The listener is PLAIN HTTP: the bearer token
                        # and the request body cross the network in
                        # clear text. Put the port behind the
                        # dashboard's TLS-terminating proxy, or behind
                        # a firewall that limits it to the dashboard's
                        # address.
                        #
                        # The bearer token is NOT configured here: it
                        # lives in the database and is set from the
                        # admin UI's "Dashboard" card on the
                        # /settings page (or from the NGX_API__TOKEN
                        # environment variable on the very first
                        # boot). The card also carries the switch that
                        # turns the API on — a token alone is not
                        # enough: until the switch is on, every call
                        # is answered with `403 api_disabled`.

acme:
  email: ""               # ACME registration email
  cert_dir: ./certs       # where CertManager looks for host blobs
                          # (autocert DirCache native layout: {host} or {host}+rsa)
                          # v2 has NO `default` blob fallback — each host
                          # must have its own cert on disk.
  # Production LE
  acme_directory: https://acme-v02.api.letsencrypt.org/directory  # Production LE.
  # Override with NGX_ACME__ACME_DIRECTORY env (e.g. https://acme-staging-v02.api.letsencrypt.org/directory for testing).
  # acme_directory: https://acme-staging-v02.api.letsencrypt.org/directory
  renew_threshold_days: 14
  renew_check_interval_hours: 6
  key_type: ecdsa         # ecdsa | rsa (default: ecdsa)
  # NOTE: in v2 there is no global `autorenew` toggle. Auto-issuance is
  # controlled per-domain via `domains.auto_issue` in the database, and
  # the DNS provider used for DNS-01 challenges is set per-domain via
  # `domains.dns_provider` (referencing a row in the `dns_providers`
  # table). See the v2 design doc for details.
  # ── ACME lifecycle hooks ───────────────────────────────────────────
  # Each hook is a shell command, run with `sh -c`, so shell syntax
  # works. Two environment variables are set for every hook:
  #   DOMAIN     the domain being issued
  #   CERT_FILE  the path of the issued certificate — EMPTY for
  #              `pre_renew` (no certificate exists yet), set for
  #              `post_renew` and `deploy`
  # The hooks run in this order:
  #   pre_renew  →  issuance  →  post_renew  →  deploy
  # A non-zero exit from `pre_renew` **aborts** that domain's issuance
  # and marks the certificate as failed. A non-zero exit from
  # `post_renew` or `deploy` is only logged as a warning — the
  # certificate is already on disk and the issuance counts as
  # successful.
  # pre_renew: "/usr/local/bin/prepare-dns.sh"
  # post_renew: "/usr/local/bin/notify-ops.sh"
  # deploy: "/usr/local/bin/reload-proxy.sh"

provider:
  # How often the providers' published source-IP ranges are refreshed
  # (issue #122). The fetch is conditional (ETag / Last-Modified), so
  # a short interval costs one cheap request per provider URL. A
  # failed fetch backs off (60s -> 1800s) and never removes the
  # stored ranges. Default 3600.
  ip_refresh_interval_secs: 3600

# The IP reputation check (issue #141) has NO section here on purpose:
# it is configured in the database and edited from the dashboard
# (`/settings`), because the only credential it carries is a provider
# API key and a key in this file ends up in backups and in shell
# history. It is on by default — a throttled client whose address the
# reputation library convicts, or whose user agent declares itself a
# bot, is answered 403 instead of 429. See
# https://github.com/cnlangzi/pangolin/blob/main/docs/configuration.md

tls:
  enable_h2: true       # advertise HTTP/2 via ALPN for direct sites and for
                        # tunnel sites whose tun is on the QUIC transport.
                        # A tunnel on the WebSocket/TCP fallback (backend with a
                        # `tun_name:` prefix) negotiates h1 at runtime, and so
                        # does a tunnel that is offline.
                        # See TlsConfig docs in crates/pangolin-core/src/config.rs.

# ── PID file ─────────────────────────────────────────────────────────────
# Where the gateway writes its process number (issue #233). The file
# holds one decimal number and a newline, and it is the anchor for
# the operator commands that address the gateway by its number.
#
# The section is commented out on purpose: without it the path is
# derived from THIS file's own path (`ngx.yml` → `ngx.pid`), which is
# what a development checkout wants. A packaged deployment has to
# name an absolute path — its configuration lives in `/etc/pangolin/`,
# which the service user cannot write to. See
# packaging/config/ngx.yml.
# pid:
#   pid_file: /var/lib/pangolin/pangolin-ngx.pid

log:
  level: debug          # env_logger filter: trace|debug|info|warn|error
  file: ""              # log file path; "" = stderr only
  # ── Access log viewer (issue #73) ──────────────────────────────────
  # Two related knobs; both can be 0 to disable their respective
  # half of the feature:
  #   * `access_log_recent`     ring buffer size for late-join replay
  #                             (new subscribers get the most recent
  #                             N entries on connect). 0 disables
  #                             replay; the live SSE stream still
  #                             works. Default 100.
  #   * `access_log_capacity`  tokio broadcast channel capacity for
  #                             the live fan-out. Lagged subscribers
  #                             see a `: lagged N events` SSE
  #                             comment. Default 1000.
  # Each entry is ~150 bytes serialized, so the default ring uses
  # ≈ 15 KB and the default channel ≈ 150 KB. Scale up for noisy
  # proxies; the admin UI tab caps the visible rows at 500 to
  # keep the DOM bounded.
  access_log_recent: 100
  access_log_capacity: 1000
  # ── Bot log side-channel (searchenginebots stage-1) ────────────────
  # Filters each request's User-Agent against a built-in rule
  # table (~40 entries: Googlebot/Bingbot/Baiduspider/GPTBot/
  # ClaudeBot/…). Detected bots are written to
  # `<dir>/bot-YYYY-MM-DD.jsonl` (UTC daily rotation), fed to a
  # dedicated `/api/logs/bots/stream` SSE channel, and counted
  # per (bot, host) pair for the `/logs/bots` dashboard card.
  #
  # Non-bot traffic (real browsers, curl, …) is unaffected —
  # the detector runs only on the hot path's already-built
  # AccessLogEntry.
  #
  # The side-channel is always on — the rate limiter's known-bot
  # exemption depends on it, and a disabled bot log used to silently
  # turn the gateway's `P-Known-Bot` header into `0`. The old
  # `enabled` key is retired: a config that still carries it parses
  # fine and logs a warning.
  #
  #   * `recent`      in-memory ring buffer for `/logs/bots`
  #                   late-join replay. 0 disables replay; the
  #                   live SSE + JSONL still work. Default 200.
  #   * `capacity`    tokio broadcast channel capacity for the
  #                   bot-only SSE fan-out. Default 1000.
  #   * `dir`         output directory for `bot-YYYY-MM-DD.jsonl`.
  #                   Created lazily on first write.
  #   * `cache_dir`   root of the knownbots cache — per-bot `ips.txt`
  #                   (the publisher's official ranges) and `rdns.txt`
  #                   (the reverse-DNS results). A `conf.d/`
  #                   sub-directory may hold extra bot YAMLs.
  #                   Default ./logs/bots/cache.
  #   * `refresh_interval_secs`
  #                   seconds between successful official IP-list
  #                   refreshes. A failed refresh retries with
  #                   exponential backoff instead of waiting a full
  #                   interval. 0 still runs one startup refresh.
  #                   Default 86400 (24h).
  bot:
    recent: 200
    capacity: 1000
    dir: ./logs/bots
    cache_dir: ./logs/bots/cache
    refresh_interval_secs: 86400
  # ── Referer log side-channel (inbound external referrals) ────────
  # Records the `Referer` header of every *top-level document
  # navigation* that lands on one of our sites from another site.
  # Rows are written to `<dir>/referer-YYYY-MM-DD.jsonl` (UTC daily
  # rotation), fed to a dedicated `/api/logs/referers/stream` SSE
  # channel, and counted per (referrer host, served host) pair for
  # the `/logs/referers` dashboard card.
  #
  # Only document navigations are eligible — a page view pulls a
  # couple of dozen subresources, each carrying the same `Referer`
  # header, so counting requests would inflate the figure roughly
  # twentyfold. A referral inside the current *site* (a link
  # between two of its own domains) is internal and is not
  # recorded.
  #
  # The side-channel is always on — it is the same shape as the bot
  # log above, and `false` was never "a slower version of the same
  # thing": turning it off drops the whole "where did this visitor
  # come from" dimension. The old `enabled` key is retired: a config
  # that still carries it parses fine and logs a warning.
  #
  #   * `recent`     in-memory ring buffer for `/logs/referers`
  #                  late-join replay. 0 disables replay; the
  #                  live SSE + JSONL still work. Default 200.
  #   * `capacity`   tokio broadcast channel capacity for the
  #                  referer-only SSE fan-out. Default 1000.
  #   * `dir`        output directory for `referer-YYYY-MM-DD.jsonl`.
  #                  Created lazily on first write.
  referer:
    recent: 200
    capacity: 1000
    dir: ./logs/referers
  # ── Traffic side-channel (in-memory, no persistence) ──────────────
  # The gateway counts requests per host / path / status in memory and
  # feeds the `/traffic` admin page.
  #   * `enabled`  master switch. `false` does not spawn the
  #                aggregator thread and the proxy hot path stops
  #                feeding it. Default true.
  traffic:
    enabled: true
