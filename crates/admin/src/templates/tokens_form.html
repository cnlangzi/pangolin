<div class="p-6">
  <h2 class="text-lg font-semibold text-slate-900 mb-4">{% if token %}Edit token{% else %}New token{% endif %}</h2>
  <form method="POST" action="/admin/api/tokens" hx-target="#form-result" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Token name</label>
      <input type="text" name="name" required value="{% if token %}{{ token.name }}{% endif %}"
        placeholder="my-token"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Expires at <span class="text-slate-400 font-normal">(optional)</span></label>
      <input type="date" name="expires_at"
        value="{% if token and token.expires_at %}{{ token.expires_at.format("%Y-%m-%d") }}{% endif %}"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
      <p class="text-xs text-slate-500 mt-1">Leave empty for no expiry</p>
    </div>
    <div id="form-result"></div>
    <div class="flex gap-2 pt-2">
      <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-lg">Create</button>
      <button type="button" hx-get="/admin/api/tokens" hx-target="#modal-body" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg">Cancel</button>
    </div>
  </form>
</div>
