<div class="p-6">
  <h2 class="text-lg font-semibold text-slate-900 mb-4">{% if cert %}Edit cert{% else %}Add cert{% endif %}</h2>
  <form method="POST" action="/admin/api/certs" hx-target="#form-result" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Domain</label>
      <input type="text" name="domain" required value="{% if cert %}{{ cert.domain }}{% endif %}"
        placeholder="example.com"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Certificate file (PEM)</label>
      <input type="text" name="cert_file" required value="{% if cert %}{{ cert.cert_file }}{% endif %}"
        placeholder="/etc/ssl/certs/example.crt"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Key file (PEM)</label>
      <input type="text" name="key_file" required value="{% if cert %}{{ cert.key_file }}{% endif %}"
        placeholder="/etc/ssl/private/example.key"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Expires at <span class="text-slate-400 font-normal">(optional)</span></label>
      <input type="date" name="expires_at"
        value="{% if cert and cert.expires_at %}{{ cert.expires_at.format("%Y-%m-%d") }}{% endif %}"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
    </div>
    <div id="form-result"></div>
    <div class="flex gap-2 pt-2">
      <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-lg">Save</button>
      <button type="button" hx-get="/admin/api/certs" hx-target="#modal-body" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg">Cancel</button>
    </div>
  </form>
</div>
