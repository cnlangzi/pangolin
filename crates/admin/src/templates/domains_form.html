<div class="p-6">
  <h2 class="text-lg font-semibold text-slate-900 mb-4">{% if domain %}Edit domain{% else %}New domain{% endif %}</h2>
  <form method="POST" action="/admin/api/domains" hx-target="#form-result" class="space-y-4">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Domain name</label>
      <input type="text" name="domain" required value="{% if domain %}{{ domain.domain }}{% endif %}"
        placeholder="example.com"
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
    </div>
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1">Site</label>
      <select name="site_id" required
        class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
        <option value="">Select a site...</option>
        {% for site in sites %}
        <option value="{{ site.id }}" {% if domain and domain.site_id == site.id %}selected{% endif %}>{{ site.backend }}</option>
        {% endfor %}
      </select>
    </div>
    <div id="form-result"></div>
    <div class="flex gap-2 pt-2">
      <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-lg">Save</button>
      <button type="button" hx-get="/admin/api/domains" hx-target="#modal-body" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg">Cancel</button>
    </div>
  </form>
</div>
