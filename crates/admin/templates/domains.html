<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Domains — Pangolin</title>
<link href="/admin/app.css?v=__CSS_HASH__" rel="stylesheet">
<script src="https://unpkg.com/htmx.org@1.9.0"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
</style>
</head>
<body class="bg-slate-100 min-h-screen font-sans">

<header class="sticky top-0 z-50 bg-pangolin-slate border-b border-pangolin-zinc shadow-sm">
  <div class="flex items-center justify-between px-4 py-3">
    <a href="/admin/" class="flex items-center gap-2.5 text-white font-bold text-lg">
      <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-brand-500 to-pangolin-accent flex items-center justify-center shadow">
        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/></svg>
      </div>
      <span class="hidden sm:inline">Pangolin</span>
    </a>
    <nav class="hidden md:flex items-center gap-0.5">
      <a href="/admin/" class="nav-link">Dashboard</a>
      <a href="/admin/sites" class="nav-link">Sites</a>
      <a href="/admin/domains" class="nav-link nav-link-active">Domains</a>
      <a href="/admin/tun" class="nav-link">Tunnels</a>
      <a href="/admin/tokens" class="nav-link">Tokens</a>
      <a href="/admin/certs" class="nav-link">Certs</a>
    </nav>
    <div class="flex items-center gap-2">
      <form method="POST" action="/admin/logout" class="hidden md:block">
        <button type="submit" class="text-pangolin-silver hover:text-white text-sm transition-colors px-3 py-1.5 rounded hover:bg-slate-700">Sign out</button>
      </form>
      <button id="menu-toggle" class="md:hidden text-pangolin-silver hover:text-white p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </div>
  <nav id="mobile-nav" class="hidden md:hidden border-t border-pangolin-zinc px-4 py-3 space-y-1">
    <a href="/admin/" class="mobile-nav-link">Dashboard</a>
    <a href="/admin/sites" class="mobile-nav-link">Sites</a>
    <a href="/admin/domains" class="mobile-nav-link mobile-nav-link-active">Domains</a>
    <a href="/admin/tun" class="mobile-nav-link">Tunnels</a>
    <a href="/admin/tokens" class="mobile-nav-link">Tokens</a>
    <a href="/admin/certs" class="mobile-nav-link">Certs</a>
    <form method="POST" action="/admin/logout" class="pt-2 border-t border-slate-700 mt-2">
      <button type="submit" class="mobile-nav-link text-red-400 hover:text-red-300 w-full text-left">Sign out</button>
    </form>
  </nav>
</header>

<main class="px-4 py-6 md:px-6 md:py-6 max-w-7xl mx-auto">
  <div class="mb-6 flex items-center justify-between">
    <div>
      <h1 class="text-2xl font-bold text-slate-900">Domains</h1>
      <p class="text-slate-500 text-sm mt-1">Map domain names to upstream sites</p>
    </div>
    <button hx-get="/admin/api/domains/new" hx-target="#modal-body" class="hidden md:inline-flex items-center gap-2 px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      New domain
    </button>
  </div>
  <button hx-get="/admin/api/domains/new" hx-target="#modal-body" class="md:hidden mb-4 inline-flex items-center gap-2 px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-medium rounded-lg w-full justify-center">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
    New domain
  </button>

  <div id="domains-table">
    {% include "domains_table_inner.html" %}
  </div>

  <dialog id="modal" class="fixed inset-0 z-50 bg-black/50 backdrop-blur-sm flex items-end md:items-center justify-center p-4 w-full">
    <div id="modal-body" class="bg-white rounded-t-2xl md:rounded-2xl shadow-2xl w-full max-w-md max-h-[85vh] overflow-y-auto"></div>
    <script>
      document.getElementById('modal').addEventListener('htmx:afterSwap', function() { document.getElementById('modal').showModal(); });
      document.getElementById('modal').addEventListener('click', function(e) { if (e.target === document.getElementById('modal')) document.getElementById('modal').close(); });
    </script>
  </dialog>
</main>

<div id="toast" class="fixed bottom-4 right-4 z-50"></div>
<script>
document.getElementById('menu-toggle').addEventListener('click', function() { document.getElementById('mobile-nav').classList.toggle('hidden'); });
document.body.addEventListener('htmx:afterSwap', function(e) { if (e.detail.target.id === 'toast') { setTimeout(function() { e.detail.target.innerHTML = ''; }, 4000); } });
</script>
</body>
</html>
