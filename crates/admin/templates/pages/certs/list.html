{% extends "layouts/base.html" %}

{% block title %}Certificates — Pangolin{% endblock %}

{% block content %}
<main class="px-4 py-6 md:px-6 lg:px-8 max-w-7xl mx-auto">
  <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white">Certificates</h1>
      <p class="text-slate-600 dark:text-slate-300 text-sm md:text-base mt-1">TLS certificates — manually uploaded or ACME-issued</p>
    </div>
    <a href="/certs/new" class="inline-flex items-center justify-center gap-2 w-full sm:w-auto rounded-lg bg-accent-500 hover:bg-accent-600 active:bg-accent-700 px-4 py-2.5 text-sm font-medium text-white shadow-sm hover:shadow-md hover:-translate-y-px focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent-500 focus-visible:ring-offset-2 transition">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      Add cert
    </a>
  </div>

  <div id="certs-table" class="scrollbar-thin">
    {% include "views/certs/_table.html" %}
  </div>
</main>
{% endblock %}
