{% extends "base.html" %}

{% block title %}Sites — Pangolin{% endblock %}

{% block content %}
<main class="px-4 py-6 md:px-6 lg:px-8 max-w-7xl mx-auto">
  <div class="mb-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white">Sites</h1>
      <p class="text-slate-600 dark:text-slate-300 text-sm md:text-base mt-1">Configure upstream backends and their route rules</p>
    </div>
    <a href="/admin/sites/new" class="btn-accent w-full sm:w-auto">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
      </svg>
      New site
    </a>
  </div>

  <div id="sites-table" class="scrollbar-thin">
    {% include "sites_table_inner.html" %}
  </div>
</main>
{% endblock %}
