{% extends "base.html" %}

{% block title %}New domain — Pangolin{% endblock %}

{% block content %}
<main class="px-4 py-6 md:px-6 lg:px-8 max-w-2xl mx-auto">
  <div class="mb-6">
    <a href="/admin/domains" class="text-sm text-slate-600 dark:text-slate-300 hover:text-accent-500 inline-flex items-center gap-1">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
      Back to domains
    </a>
    <h1 class="mt-2 text-2xl md:text-3xl font-bold text-slate-900 dark:text-white">New domain</h1>
    <p class="text-slate-600 dark:text-slate-300 text-sm md:text-base mt-1">
      Map a hostname to one of your configured sites
    </p>
  </div>

  <form method="POST" action="/admin/domains/new" class="card p-6 space-y-4">
    <input type="hidden" name="_csrf" value="__CSRF__">

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-2" for="domain-name">Domain name</label>
      <input type="text" name="domain" id="domain-name" required
        placeholder="example.com"
        class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500">
    </div>

    <div>
      <label class="block text-sm font-medium text-slate-700 dark:text-slate-200 mb-2" for="domain-site">Site</label>
      <select name="site_name" id="domain-site" required
        class="w-full border border-slate-300 dark:border-slate-600 dark:bg-slate-800 dark:text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-accent-500 focus:ring-1 focus:ring-accent-500">
        <option value="">Select a site...</option>
        {% for site in sites %}
        <option value="{{ site.name }}"{% if self.is_site_preselected(site.name) %} selected{% endif %}>{{ site.name }} — {{ site.backend }}</option>
        {% endfor %}
      </select>
    </div>

    {% if let Some(e) = error %}
    <div class="alert-error text-sm">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
      </svg>
      <span>{{ e }}</span>
    </div>
    {% endif %}

    <div class="flex gap-2 pt-2">
      <button type="submit" class="btn-accent">Save</button>
      <a href="/admin/domains" class="px-4 py-2 bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-100 text-sm font-medium rounded-lg">Cancel</a>
    </div>
  </form>
</main>
{% endblock %}
