<div class="p-6">
  <h2 class="text-lg font-semibold text-slate-900 mb-4">{% if let Some(_) = site %}Edit site{% else %}New site{% endif %}</h2>
  <form method="POST" action="/admin/api/sites" class="space-y-4">
    <input type="hidden" name="_csrf" value="__CSRF__">
    <div>
      <label class="block text-sm font-medium text-slate-700 mb-1" for="site-backend">Backend URL</label>
      <input type="text" name="backend" id="site-backend" required
        value="{% if let Some(s) = site %}{{ s.backend }}{% endif %}"
        class="w-full border {% if let Some(_) = error %}border-red-500{% else %}border-slate-300{% endif %} rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500">
      <p class="text-xs text-slate-500 mt-1">http://... or tun_name:http://...</p>
    </div>
    <div id="form-result">{% if let Some(e) = error %}<p class="text-sm text-red-600 mt-2 flex items-start gap-1.5"><svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.28 7.22a.75.75 0 00-1.06 1.06L8.94 10l-1.72 1.72a.75.75 0 101.06 1.06L10 11.06l1.72 1.72a.75.75 0 101.06-1.06L11.06 10l1.72-1.72a.75.75 0 00-1.06-1.06L10 8.94 8.28 7.22z" clip-rule="evenodd"/></svg><span>{{ e }}</span></p>{% endif %}</div>
    <div class="flex gap-2 pt-2">
      <button type="submit" class="px-4 py-2 bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold rounded-lg">{% if let Some(_) = site %}Update{% else %}Create{% endif %}</button>
      <button type="button" data-on:click="document.getElementById('modal').close()" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-medium rounded-lg">Cancel</button>
    </div>
  </form>
</div>
