[package]
name = "pangolin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pangolin core: types, parsing, in-memory indexes (no pingora dep)"

[dependencies]
rusqlite.workspace = true
refinery = { version = "0.9", features = ["rusqlite"] }
serde.workspace = true
serde_json.workspace = true
figment.workspace = true
log.workspace = true
thiserror.workspace = true
chrono.workspace = true
env_logger.workspace = true
sha2.workspace = true
# The dash API address the dashboard channel dials (issue #262).
url = "2"
tokio = { workspace = true }
parking_lot.workspace = true
anyhow.workspace = true
async-trait.workspace = true
# The tunnel's wire protocol, its two transports and the TOFU pin
# store (issue #159). The crate is published — see the root
# Cargo.toml — so this repository no longer carries a second copy of
# the protocol that could drift away from it.
pangolin-tun.workspace = true
# rustls stays: this crate installs the process-level crypto provider
# (`install_crypto_provider`), and nothing here builds a TLS config
# without one.
rustls.workspace = true

# Static-file serving helpers used by file:// backends.
mime_guess.workspace = true
httpdate.workspace = true

# parking_lot::Mutex is the sync primitive behind App's access-log
# ring buffer (issue #73). Sync, non-poisoning, fast-path acquire —
# the response_filter hot path holds it for a single VecDeque bound
# check + push_back.

# DashMap is the concurrent hashmap behind CertLinkCache
# (fix/cert_www). The SNI callback reads under contention from
# concurrent handshake tasks; DashMap's per-shard locking gives
# us lock-free reads in the common case.
dashmap.workspace = true

# Bot verification (UA + official IP ranges / RDNS). Side-channel only;
# the request hot path calls `verify` synchronously and never awaits.
#
# The published crate (issue #146) — the port lives in
# github.com/cnlangzi/knownbots-rust, not in this repository. The
# version and the `full` feature are workspace-managed; see the root
# Cargo.toml.
knownbots.workspace = true

# CIDR parsing / matching for the per-site IP rules (issue #117).
ipnet.workspace = true

# IP reputation (issue #141). The library is consulted only on the
# throttle path; the verdict it answers with is the local one, and the
# upstream verification it schedules runs in the library's own worker
# thread — never on the request path.
badbots.workspace = true

[dev-dependencies]
tempfile = { workspace = true }
# `figment::Jail` lives behind the `test` feature flag — used by the
# config tests to sandbox `NGX_*` env vars that the Makefile's
# `.env`-export step would otherwise leak in.
figment = { workspace = true, features = ["test"] }