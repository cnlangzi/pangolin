[package]
name = "pangolin-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pangolin core: types, parsing, in-memory indexes (no pingora dep)"

[dependencies]
rusqlite.workspace = true
refinery = { version = "0.9", features = ["rusqlite"] }
serde.workspace = true
serde_json.workspace = true
figment.workspace = true
log.workspace = true
thiserror.workspace = true
chrono.workspace = true
env_logger.workspace = true
sha2.workspace = true
tokio = { workspace = true }
futures.workspace = true
futures-util.workspace = true
parking_lot.workspace = true
anyhow.workspace = true
async-trait.workspace = true
# Tunnel transport (issue #39): yamux over fastwebsockets, plus
# permessage-deflate (built into fastwebsockets) and rustls for
# wss:// on the tun side.
tokio-yamux.workspace = true
fastwebsockets.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
# Manual WS upgrade helpers (Sec-WebSocket-Key / Accept).
sha1 = "0.10"
base64 = "0.22"
rand = "0.8"

# Static-file serving helpers used by file:// backends.
mime_guess.workspace = true
httpdate.workspace = true

# parking_lot::Mutex is the sync primitive behind App's access-log
# ring buffer (issue #73). Sync, non-poisoning, fast-path acquire —
# the response_filter hot path holds it for a single VecDeque bound
# check + push_back.

[dev-dependencies]
tempfile = { workspace = true }
# `figment::Jail` lives behind the `test` feature flag — used by the
# config tests to sandbox `NGX_*` env vars that the Makefile's
# `.env`-export step would otherwise leak in.
figment = { workspace = true, features = ["test"] }