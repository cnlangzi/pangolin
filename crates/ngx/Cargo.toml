[package]
name = "ngx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pangolin gateway (ngx) — public-facing HTTP/WebSocket proxy"

[lib]
name = "ngx"
path = "src/lib.rs"

[[bin]]
name = "ngx"
path = "src/main.rs"

[features]
default = []
# Enable integration tests (requires Pebble ACME test server running on port 14000).
# Run with: cargo test --features integration -p ngx
integration = []

[dependencies]
pangolin-core = { path = "../pangolin-core" }
admin = { path = "../admin" }
# The dashboard-facing management API (issue #185).
api = { path = "../api" }
# The `cache` feature brings in pingora-cache — the crate that holds
# the HTTP cache engine: the state machine, the Cache-Control parser,
# the cache key, the single-flight lock and the eviction framework the
# edge cache is built on (issue #259).  It is published on pingora's
# own release train, so no dependency outside the pingora family is
# added.
pingora = { workspace = true, features = ["openssl", "cache"] }
pingora-core = "0.9"
pingora-openssl = "0.9"
rusqlite.workspace = true
http-body = "1"
async-trait.workspace = true
tokio.workspace = true
tokio-util.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["cargo"] }

# HTTP protocol
http = "1"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["client", "http1"] }
hyper-rustls = "0.27"

# WebSocket
fastwebsockets.workspace = true
futures-util.workspace = true

# QUIC transport for the tunnel (issue #153) — the primary transport.
quinn.workspace = true

# The tunnel's wire protocol and its transports (issue #159). The
# crate is published — see the root Cargo.toml. The yamux session
# comes from it too, so `tokio-yamux` is no longer a direct
# dependency of the gateway.
pangolin-tun.workspace = true

# The listeners the gateway binds outside pingora (the tunnel
# listener and the QUIC endpoint) set SO_REUSEPORT before they bind
# (issue #233).  Same version the tree already carries — see the
# root Cargo.toml.
socket2.workspace = true

# TLS / ACME
instant-acme = { version = "0.8", features = ["hyper-rustls"] }
rustls = "0.23.40"
pem = "3"
x509-parser = "0.15"
rustls-native-certs = "0.7"

# Serialization
mime_guess = "2"

# Cryptography (for X.509 parsing in ACME)
openssl = "0.10"
time = "0.3"

# DNS-01 challenge
hickory-resolver = "0.26"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots"] }
hmac = "0.13"
sha2.workspace = true
uuid = { version = "1", features = ["v4"] }

# Utilities
bytes = "1"
httpdate = "1"

# The process model of the graceful reload (issue #234): the
# supervisor forks the generations, the readiness pipe is an
# inherited descriptor, and the signals are sent with `kill`.
libc.workspace = true

# WebSocket
sha1.workspace = true
base64 = "0.23"
urlencoding = "2"

[dev-dependencies]
tempfile = "3"
# The refresh service's test builds a library that asks nobody, so it
# needs the library's own builder. Dev-only: the shipped binary never
# names the crate — it reads the instance from `App`.
badbots.workspace = true
bytes = "1"
http-body = "0.4"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["http1"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ctor = "0.1"