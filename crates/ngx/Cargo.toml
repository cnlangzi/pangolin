[package]
name = "ngx"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pangolin gateway (ngx) — public-facing HTTP/WebSocket proxy"

[lib]
name = "ngx"
path = "src/lib.rs"

[[bin]]
name = "ngx"
path = "src/main.rs"

[features]
default = []
# Enable integration tests (requires Pebble ACME test server running on port 14000).
# Run with: cargo test --features integration -p ngx
integration = []

[dependencies]
pangolin-core = { path = "../pangolin-core", features = ["rt"] }
admin = { path = "../admin" }
pingora.workspace = true
pingora-core = "0.8"
rusqlite.workspace = true
http-body = "1"
async-trait.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
thiserror.workspace = true
chrono.workspace = true
clap = { workspace = true, features = ["cargo"] }

# HTTP protocol
http = "1"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["client", "http1"] }
hyper-rustls = "0.27"

# WebSocket
tokio-tungstenite.workspace = true
flate2.workspace = true
futures-util.workspace = true

# TLS / ACME
rcgen.workspace = true
instant-acme = "0.7"
rustls = "0.23.40"
pem = "3"
x509-parser = "0.15"
rustls-native-certs = "0.7"

# Serialization
mime_guess = "2"

# Cryptography (for X.509 parsing in ACME)
openssl = "0.10"
time = "0.3"

# Utilities
bytes = "1"
httpdate = "1"

# WebSocket
sha1 = "0.10"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"
bytes = "1"
http-body = "0.4"
http-body-util = "0.1"
hyper = { version = "1.10", features = ["http1"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ctor = "0.1"