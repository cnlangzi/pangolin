[package]
name = "tun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pangolin tunnel node (tun) — connects to ngx, proxies customer traffic"

[[bin]]
name = "tun"
path = "src/main.rs"

[lib]
name = "tun"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
fastwebsockets.workspace = true
tokio-yamux.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
futures.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
figment.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
chrono.workspace = true
pangolin-core = { version = "0.2.0", path = "../pangolin-core" }
http = "1.4.1"
url = "2.5.8"
mime_guess = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots"] }

[dev-dependencies]
# `figment::Jail` lives behind the `test` feature flag — used by the
# config tests to sandbox `TUN_*` env vars that the Makefile's
# `.env`-export step would otherwise leak in.
figment = { workspace = true, features = ["test"] }