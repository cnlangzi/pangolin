[package]
name = "tun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pangolin tunnel node (tun) — connects to ngx, proxies customer traffic"

[[bin]]
name = "tun"
path = "src/main.rs"

[lib]
name = "tun"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
fastwebsockets.workspace = true
tokio-yamux.workspace = true
# The tun is a byte relay (issue #153): it no longer speaks HTTP, so
# it needs neither `pingora-core` nor `pingora-http` — and no HTTP
# types either. The tunnel's byte-stream interface lives in
# `pangolin-core`.
async-trait.workspace = true
futures.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
figment.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
chrono.workspace = true
pangolin-core = { path = "../pangolin-core" }

[dev-dependencies]
# `figment::Jail` lives behind the `test` feature flag — used by the
# config tests to sandbox `TUN_*` env vars that the Makefile's
# `.env`-export step would otherwise leak in.
figment = { workspace = true, features = ["test"] }
# The fallback-policy tests write their state files into a temp dir.
tempfile = { workspace = true }