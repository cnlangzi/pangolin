[package]
name = "tun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pangolin tunnel node (tun) — connects to ngx, proxies customer traffic"

[[bin]]
name = "tun"
path = "src/main.rs"

[lib]
name = "tun"
path = "src/lib.rs"

[dependencies]
# The tun is a byte relay (issue #153): it no longer speaks HTTP, so
# it needs neither `pingora-core` nor `pingora-http` — and no HTTP
# types either.
tokio.workspace = true
serde.workspace = true
figment.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
clap.workspace = true
# The tunnel's wire protocol and its client (issue #159). The crate
# is published — see the root Cargo.toml — so the tun binary is the
# configuration and the entry point, and the client itself lives
# there.
pangolin-tun.workspace = true
pangolin-core = { path = "../pangolin-core" }

[dev-dependencies]
# `figment::Jail` lives behind the `test` feature flag — used by the
# config tests to sandbox `TUN_*` env vars that the Makefile's
# `.env`-export step would otherwise leak in.
figment = { workspace = true, features = ["test"] }
