[package]
name = "tun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pangolin tunnel node (tun) — connects to ngx, proxies customer traffic"

[[bin]]
name = "tun"
path = "src/main.rs"

[lib]
name = "tun"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
fastwebsockets.workspace = true
tokio-yamux.workspace = true
bytes = "1"
# pingora-core powers the tun-side HTTP client (v8 design).
# We use the default features (matches ngx) — the rustls
# feature is enabled transitively through `rustls` from
# the workspace patch. Replacing the previous reqwest +
# rustls + webpki-roots stack.
pingora-core = { workspace = true }
pingora-http = { workspace = true }
async-trait.workspace = true
futures.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
figment.workspace = true
log.workspace = true
env_logger.workspace = true
anyhow.workspace = true
thiserror.workspace = true
clap.workspace = true
chrono.workspace = true
pangolin-core = { version = "0.2.0", path = "../pangolin-core" }
http = "1.4.1"

[dev-dependencies]
# `figment::Jail` lives behind the `test` feature flag — used by the
# config tests to sandbox `TUN_*` env vars that the Makefile's
# `.env`-export step would otherwise leak in.
figment = { workspace = true, features = ["test"] }