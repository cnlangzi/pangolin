[package]
name = "api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pangolin dashboard-facing management API (issue #185)"

[lib]
name = "api"
path = "src/lib.rs"

[features]
default = []
# The **mock** dashboard key (issue #262).
#
# The production build verifies the dashboard's Ed25519 signature
# against the public key compiled into the binary. This feature swaps
# that verifier for a mock that accepts one sentinel signature — so
# the end-to-end suite never needs a real key pair and never touches
# the production key.
#
# A build with this feature **must not** be pointed at a real
# dashboard: it says so loudly on startup.
test-dashboard-key = []

[dependencies]
pangolin-core = { path = "../pangolin-core" }
# The admin UI's form parsers. The API validates through the very same
# functions the HTML forms use, so a submission the form rejects is
# rejected by the API too — with the same message (issue #185, R11).
#
# The dependency goes the other way round too — the admin crate knows
# nothing about the API — and the API calls **only** the `parse_*`
# functions of `admin::routes`. The admin's HTTP handlers are not part
# of the API's surface: they render HTML, they expect a CSRF token,
# and they would answer a request that never passed the signature
# gate.
admin = { path = "../admin" }

serde = { workspace = true }
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
chrono.workspace = true
rusqlite.workspace = true
sha2.workspace = true

# The header map the command carries.
http = "1"

# Ed25519 — the dashboard's signature. `ring` is already in the
# tree (rustls' provider), so this adds no new crate to the build.
ring = "0.17"

# HMAC-SHA256 — the node's signature. The version is the workspace's
# (see the root manifest): `hmac` is already in the tree, so this adds
# no new crate.
hmac.workspace = true

# The nonce cache's lock — sync, non-poisoning, no hot path.
parking_lot.workspace = true

# base64url for the signature header, hex for the key fingerprint.
base64.workspace = true
hex.workspace = true

# Percent-encoding for the form bodies the admin parsers read.
urlencoding = "2"
