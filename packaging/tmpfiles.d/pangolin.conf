# Retention for the gateway's JSONL side-channels.
#
# The bot log and the referer log are rotated per UTC day, so the
# directories grow by one file per day.  This rule removes the files
# that are older than 30 days; systemd-tmpfiles runs it at boot and
# every day after that.
#
# The knownbots IP-list cache under /var/cache/pangolin/bots is not
# listed here on purpose — it holds address lists that are refreshed
# in place, not a growing series of files.

d /var/log/pangolin/bots 0750 pangolin pangolin 30d
d /var/log/pangolin/referers 0750 pangolin pangolin 30d
