# pangolin-ngx configuration — installed by the pangolin-ngx package.
#
# This file is a dpkg/rpm *conffile* (`config|noreplace`): your edits
# survive an upgrade untouched, and the package never overwrites them.
#
# It is NOT the repository's development `ngx.yml`. That one carries
# relative paths, the non-privileged development ports (8000/8443) and
# a few retired keys; this one carries the paths and the ports the
# packaged service actually runs with. Every path here is absolute —
# a relative path would follow the service's working directory
# (`/var/lib/pangolin`) instead of meaning what it says.
#
# ⚠  Before you put this gateway on the public internet:
#
#   * `admin.password` — the default below is `admin`, a public
#     value. Change it.
#   * `admin.addr` — `0.0.0.0:9081` exposes the admin UI to every
#     network the host can reach. Narrow it to `127.0.0.1:9081` (and
#     use an SSH tunnel) or to an internal address.
#   * `acme.email` — empty means the ACME account is registered
#     without a contact address, so you get no expiry notices. Put a
#     real mailbox in.
#   * `tunnel.addr` — the default below only accepts tunnel clients
#     from the same host. Set it to the address the tunnel nodes
#     connect to, and make sure UDP 9001 is reachable (QUIC and the
#     TCP fallback share the port number).
#
# The full field reference is
# https://github.com/cnlangzi/pangolin/blob/main/docs/configuration.md

addr:
  http: 0.0.0.0:80
  https: 0.0.0.0:443

admin:
  addr: 0.0.0.0:9081
  username: admin
  password: admin

acme:
  email: ""
  cert_dir: /var/lib/pangolin/certs
  acme_directory: https://acme-v02.api.letsencrypt.org/directory
  renew_threshold_days: 14
  renew_check_interval_hours: 6
  key_type: ecdsa

log:
  bot:
    dir: /var/log/pangolin/bots
    cache_dir: /var/cache/pangolin/bots
  referer:
    dir: /var/log/pangolin/referers
