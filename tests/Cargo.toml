[package]
name = "pangolin-integration-tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "pangolin_integration_tests"
path = "src/lib.rs"

[dependencies]
# Core crates
pangolin-core = { path = "../crates/pangolin-core" }
ngx = { path = "../crates/ngx" }
tun = { path = "../crates/tun" }

# Test infra
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-manual-roots", "json", "cookies"] }
tempfile = "3"
http-body-util = "0.1"
bytes = "1"
httpdate = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.20"

# Async / ws
futures-util = "0.3"

# Crypto provider init + time
ctor = "0.1"
chrono = "0.4"
rustls = "0.23.40"
lazy_static = "1.5"

# E2E tests
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
sha2 = "0.10"
# Signal delivery to the spawned `pangolin-ngx` child — used by the
# SSE-shutdown-latency e2e test to send SIGINT (not SIGKILL, which
# `Child::start_kill` provides) so the test can observe the
# graceful-shutdown path.
libc = "0.2"

# WebSocket (for Sec-WebSocket-Accept in tests + client side of ws/wss e2e)
sha1 = "0.10"
base64 = "0.22"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# Manual TLS connector for wss:// tests where we drive a custom
# rustls ClientConfig (trusting a per-test self-signed cert).
tokio-rustls = "0.26"

# Real-binary e2e harness: self-signed cert generation
rcgen = "0.14"

[features]
integration = []