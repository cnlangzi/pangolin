name: CI

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs when the same PR gets a new push.
# Use PR number as group key so push events don't cancel PR runs and vice versa.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ----------------------------------------------------------------
  # Rust build + unit tests
  # ----------------------------------------------------------------
  rust:
    name: Rust build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: make lint
        run: make lint

      - name: make build
        run: make build

  # ----------------------------------------------------------------
  # Integration tests — ACME with Pebble
  # ----------------------------------------------------------------
  integration:
    name: ACME integration tests (Pebble)
    runs-on: ubuntu-latest
    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        ports:
          - "14000:14000"
          - "5001:5001"
          - "15000:15000"
        env:
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_VA_ALWAYS_VALID: "1"
          PEBBLE_LISTEN: "0.0.0.0:14000"
          PEBBLE_WFE_OVERRIDE_DNS: "127.0.0.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-

      - name: Add hosts entry for localhost.test
        run: echo "127.0.0.1 localhost.test" | sudo tee -a /etc/hosts

      - name: make test-integration
        run: make test-integration
