name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ----------------------------------------------------------------
  # Rust build + test (no pebble, unit tests only)
  # All steps reuse Makefile targets so local and CI stay in sync.
  # ----------------------------------------------------------------
  rust:
    name: Rust build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Runs: fmt --check + clippy -D warnings + test
      - name: make lint
        run: make lint

      - name: make build
        run: make build

  # ----------------------------------------------------------------
  # Admin UI build (tailwindcss)
  # ----------------------------------------------------------------
  ui:
    name: Admin UI build (tailwindcss)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Runs: npm ci + npm run build
      - name: make ui
        run: make ui

      - name: Upload CSS artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-style
          path: assets/static/style.css
          if-no-files-found: error