name: CI

on:
  pull_request:
    branches: [main]

# Default to read-only. Every job compiles pull-request code, which
# executes third-party build scripts (openssl-src, libz-ng-sys,
# ring, rusqlite's bundled sqlite) — a write-scoped token would let
# a compromised dependency push commits. Mirrors release.yml; no job
# in this workflow needs to write.
permissions:
  contents: read

# Cancel in-progress runs when the same PR gets a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ----------------------------------------------------------------
  # Lint: fmt + clippy + cargo test
  # ----------------------------------------------------------------
  lint:
    name: Lint (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96
          components: rustfmt, clippy

      # The client-side tests for `assets/app.js` run on node's built-in
      # test runner — no dependencies. `make lint` skips them when node
      # is missing, so CI installs node explicitly to enforce them.
      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.96-

      - name: make lint
        run: make lint

  # ----------------------------------------------------------------
  # Build: release compile of all binaries
  # ----------------------------------------------------------------
  build:
    name: Build (release compile)
    # ubuntu-22.04, not ubuntu-latest: the packaging job below
    # installs the binaries this job produces on debian:12 (glibc
    # 2.36) and rockylinux:9 (glibc 2.34), and a binary compiled on
    # ubuntu-latest (24.04, glibc 2.39) records a glibc floor those
    # machines do not meet — the package would be refused by its own
    # dependency.  The release workflow builds on the same image for
    # the same reason; see docs/release.md.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        # libz-ng-sys compiles C through cmake, openssl-sys is cgo
        # and needs the OpenSSL headers pkg-config points at.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # The runner label is part of the key: `runner.os` is
          # `Linux` for every ubuntu image, so a `target/` tree built
          # on ubuntu-latest would otherwise be restored here — and
          # the binaries in it would carry the wrong glibc floor.
          key: ${{ runner.os }}-${{ runner.runs-on }}-cargo-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.runs-on }}-cargo-1.96-

      - name: make build
        run: make build

      - name: Upload the binaries
        # The packaging job below packages these two binaries; the
        # artifact is the only thing that crosses between the two
        # jobs.
        uses: actions/upload-artifact@v6
        with:
          name: pangolin-linux-amd64
          path: |
            bin/pangolin-ngx
            bin/pangolin-tun
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Packaging: the packages have to install
  #
  # The unit tests check that the *description* of the packages is
  # right — the file list, the configuration template, the systemd
  # unit.  This job checks that the packages themselves work: the
  # repository is built, served over `file://`, and installed on the
  # two distribution families the packages target.
  #
  # The signing key is a throwaway one.  A pull request cannot reach
  # the archive key — and must not be able to — and the point of the
  # job is that a *signed* repository installs, not that the archive
  # key is exercised.
  # ----------------------------------------------------------------
  packaging:
    name: Packaging (apt + rpm)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 20
    env:
      GNUPGHOME: ${{ github.workspace }}/.gnupg
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install the packaging tools
        # binutils for `objdump`, dpkg-dev for `dpkg-scanpackages`,
        # createrepo-c for the rpm metadata, rpm for the signatures.
        # gnupg2 for the `gpg2` binary rpm's gpg macro points at.
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils dpkg-dev createrepo-c rpm gnupg2

      - name: Install nfpm
        env:
          NFPM_VERSION: 2.49.0
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - uses: actions/download-artifact@v7
        with:
          name: pangolin-linux-amd64
          path: dist

      - name: Build the packages
        run: |
          set -euo pipefail
          # The artifact holds the two binaries themselves, so the
          # download directory *is* the binary directory.
          ls -l dist
          # The workspace version is the placeholder the release
          # workflow overwrites with the tag's; it is what the
          # binaries report here.
          version="$(awk '/^\[workspace\.package\]/{f=1;next} /^\[/{f=0} f && /^version[[:space:]]*=/{gsub(/"/,"",$3); print $3; exit}' Cargo.toml)"
          # `VERSION`, in upper case: the next steps read `$VERSION`,
          # and an environment variable's name is case-sensitive.
          echo "VERSION=$version" >> "$GITHUB_ENV"
          sh packaging/build-packages.sh \
            --tag-version "$version" \
            --arch amd64 \
            --bin-dir dist \
            --out-dir dist/packages

      - name: Build and sign the repository
        run: |
          set -euo pipefail
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-generate-key \
            "Pangolin CI <ci@pangolin.invalid>" rsa2048 sign never
          # The site carries the key the client trusts.  This
          # repository is signed with the throwaway key — a pull
          # request cannot reach the archive key — so the site has to
          # carry *that* one instead.
          gpg --armor --export > ci-key.asc
          sh packaging/publish-repo.sh \
            --site site \
            --deb-dir dist/packages \
            --rpm-dir dist/packages \
            --version "$VERSION" \
            --key ci-key.asc \
            --sign

      - name: Install from the apt repository (debian:12)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/site:/srv:ro" -e EXPECTED_VERSION="v$VERSION" debian:12 bash -c '
            set -eux
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates
            install -d -m 0755 /etc/apt/keyrings
            cp /srv/pangolin-archive-keyring.gpg /etc/apt/keyrings/pangolin-archive-keyring.gpg
            echo "deb [signed-by=/etc/apt/keyrings/pangolin-archive-keyring.gpg] file:/srv stable main" > /etc/apt/sources.list.d/pangolin.list
            apt-get update
            apt-get install -y pangolin-ngx
            dpkg -L pangolin-ngx
            test -f /etc/pangolin/ngx.yml
            test -f /usr/bin/pangolin-ngx
            grep -q "^/etc/pangolin/ngx.yml$" /var/lib/dpkg/info/pangolin-ngx.conffiles
            test -L /etc/systemd/system/multi-user.target.wants/pangolin-ngx.service
            test ! -e /etc/systemd/system/multi-user.target.wants/pangolin-tun.service
            /usr/bin/pangolin-ngx --version | grep -q "$EXPECTED_VERSION"
          '

      - name: Install from the rpm repository (rockylinux:9)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD/site:/srv:ro" -e EXPECTED_VERSION="v$VERSION" rockylinux:9 bash -c '
            set -eux
            rpm --import /srv/pangolin-archive-keyring.asc
            printf "[pangolin]\nname=Pangolin\nbaseurl=file:///srv/rpm\nenabled=1\ngpgcheck=1\nrepo_gpgcheck=1\ngpgkey=file:///srv/pangolin-archive-keyring.asc\n" > /etc/yum.repos.d/pangolin.repo
            dnf install -y pangolin-ngx
            rpm -q pangolin-ngx
            # `rpm -K` checks the signature of a *package file*, not of
            # an installed package name — handed the name, it looks
            # for a file called "pangolin-ngx" and reports "open
            # failed".  The file is the one in the repository the
            # package was installed from.
            rpm -Kv /srv/rpm/pangolin-ngx-*.rpm
            test -f /etc/pangolin/ngx.yml
            /usr/bin/pangolin-ngx --version | grep -q "$EXPECTED_VERSION"
          '

  # ----------------------------------------------------------------
  # Cross-platform compile smoke: macOS (ngx + tun) and Windows
  # (tun) debug builds. A PR that introduces a platform-incompatible
  # dependency — e.g. a Unix-only crate — fails here, not on release
  # day when .github/workflows/release.yml compiles the same targets.
  #
  # `cargo build`, not `cargo check`: under a cross `--target`,
  # `check` never links, so link-time failures in the C dependencies
  # (ring, rusqlite's bundled sqlite, the vendored OpenSSL) would
  # slip through to the release workflow.
  #
  # Linux needs no smoke entry — the `build` job above already
  # compiles ngx + tun on ubuntu-latest. Windows compiles only
  # `tun`: `ngx` is Unix-only (pingora needs Unix sockets,
  # daemonize, sendfile; `crates/ngx` carries `#[cfg(unix)]` code of
  # its own), which is also why the release ships no Windows ngx
  # archive. macOS passes `--features openssl/vendored` explicitly:
  # vendored is already on via pingora-openssl on every platform,
  # but the flag keeps the guarantee — and with it the x64 cross
  # compile — even if that default changes (the runner's Homebrew
  # OpenSSL is arm64-only and cannot serve the cross link).
  # ----------------------------------------------------------------
  smoke-cross:
    name: Compile smoke (${{ matrix.slug }})
    runs-on: ${{ matrix.runs-on }}
    # A cold vendored-OpenSSL compile is the long pole; everything
    # else is incremental-friendly. Mirrors the release jobs.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `cargo-target` empty = native compile on the runner's arch.
        include:
          - slug: macos-arm64
            runs-on: macos-15
            packages: -p ngx -p tun
            features: --features openssl/vendored
            cargo-target: ''
          - slug: macos-x64
            runs-on: macos-15
            packages: -p ngx -p tun
            features: --features openssl/vendored
            cargo-target: x86_64-apple-darwin
          - slug: windows-amd64
            runs-on: windows-latest
            packages: -p tun
            features: ''
            cargo-target: ''
          - slug: windows-arm64
            runs-on: windows-latest
            packages: -p tun
            features: ''
            cargo-target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Add the cross target
        if: matrix.cargo-target != ''
        run: rustup target add ${{ matrix.cargo-target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # Same key shape as the release workflow's macOS/Windows
          # jobs: `cargo-target` keeps the native and cross snapshots
          # apart (`target/<triple>/` already does so on disk).
          key: ${{ runner.os }}-${{ matrix.runs-on }}-${{ matrix.cargo-target }}-cargo-smoke-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.runs-on }}-${{ matrix.cargo-target }}-cargo-smoke-1.96-

      - name: Ensure the MSVC ARM64 build tools are installed
        if: matrix.cargo-target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        # Byte-for-byte copy of the probe in the release workflow's
        # build-tun job — keep the two in sync. ring (via
        # quinn/rustls) compiles C for aarch64-pc-windows-msvc with
        # clang-cl and links with the MSVC ARM64 libraries, an
        # optional VS2022 component. Install only when missing.
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = "$installer\vswhere.exe"
          $have = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ($have) {
            Write-Output "MSVC ARM64 build tools already installed at $have"
          } else {
            $vsPath = & $vswhere -latest -products * -property installationPath
            Write-Output "Installing Microsoft.VisualStudio.Component.VC.Tools.ARM64 into $vsPath"
            & "$installer\vs_installer.exe" modify `
              --installPath "$vsPath" `
              --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
              --quiet --norestart --wait
            if ($LASTEXITCODE -ne 0) { throw "vs_installer modify failed with exit code $LASTEXITCODE" }
          }
          # ring's build script looks clang-cl / llvm-lib up on PATH;
          # the runner image ships LLVM here.
          Write-Output "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: cargo build
        shell: bash
        env:
          PACKAGES: ${{ matrix.packages }}
          FEATURES: ${{ matrix.features }}
          CARGO_TARGET: ${{ matrix.cargo-target }}
        run: |
          set -euo pipefail
          # Deliberately unquoted: the matrix values are fixed strings
          # defined above, and word-splitting is what turns them into
          # separate cargo arguments. ${CARGO_TARGET:+...} expands to
          # nothing on the native entries.
          cargo build $PACKAGES $FEATURES ${CARGO_TARGET:+--target "$CARGO_TARGET"}

  # ----------------------------------------------------------------
  # Unit tests (no integration feature)
  # ----------------------------------------------------------------
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # See the e2e job's comment — including **/*.rs in the key
          # busts the cache when source changes, avoiding the
          # "stale incremental state from a previous run" flake.
          key: ${{ runner.os }}-cargo-unit-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-unit-1.96-

      - name: Run unit tests
        run: cargo test --workspace

  # ----------------------------------------------------------------
  # E2E tests — requires Pebble ACME server
  #
  # Issue #54 regression check strategy:
  #   Pebble's `PEBBLE_VA_ALWAYS_VALID=1` (the historical setting)
  #   silently accepts every challenge WITHOUT actually performing the
  #   HTTP fetch. That's why the missing proxy-side ACME HTTP-01
  #   handler went unnoticed for so long — the validator never
  #   probed the URL, so the cert was issued regardless.
  #
  #   Two complementary tests now cover the server-side regression:
  #
  #   1. `real_e2e_acme_http01_challenge_served` and
  #      `real_e2e_acme_http01_missing_returns_404` (default-on, run
  #      via `make test-e2e`): these are deterministic HTTP-level
  #      simulations of what Pebble's validator would send. They plant
  #      a challenge file, GET it through the proxy, and assert the
  #      byte-exact response — no Pebble dependency, no port-80
  #      binding, runs on every CI green.
  #
  #   2. `real_e2e_acme_http01_full_pebble_flow` (`#[ignore]`'d):
  #      drives an actual issuance through Pebble with
  #      `PEBBLE_VA_ALWAYS_VALID=0`. We do NOT run this in CI because
  #      Pebble's VA hardcodes port 80 for HTTP-01 (RFC 8555 §8.3),
  #      and neither the service container nor the test job can bind
  #      it from CI. The test is runnable locally with sudo on a
  #      workstation that runs Pebble on the host network — see the
  #      docstring in `tests/src/real_e2e.rs` for the exact commands.
  #
  # The Pebble service below stays in `PEBBLE_VA_ALWAYS_VALID=1`
  # mode for the *client*-side tests (acme.rs::tests::acme_*), which
  # only need an ACME server that will sign certificates — they
  # don't care about challenge validation.
  #
  # `PEBBLE_WFE_NONCEREJECT=0` below is NOT optional: Pebble rejects
  # 5% of otherwise-valid anti-replay nonces by default, and
  # instant-acme retries a badNonce only 3 times, so the residual
  # failure rate is (5%)^3 per ACME request — about 1 in 250 CI runs,
  # landing on a random ACME test.  See the Pebble section of AGENTS.md.
  # ----------------------------------------------------------------
  e2e:
    name: E2E tests (Pebble)
    runs-on: ubuntu-latest
    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        ports:
          - "14000:14000"
          - "5001:5001"
          - "15000:15000"
        env:
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_VA_ALWAYS_VALID: "1"
          PEBBLE_LISTEN: "0.0.0.0:14000"
          PEBBLE_WFE_OVERRIDE_DNS: "127.0.0.1"
          # Pebble rejects 5% of otherwise-VALID anti-replay nonces by
          # default (`defaultNonceReject = 5` in wfe/wfe.go) — a fault
          # injector that exists to test clients against a hostile
          # server.  instant-acme retries a badNonce 3 times, so the
          # residual failure rate is (5%)^3 per ACME request ≈ 1 in
          # 8000, which is ~1 in 250 CI runs across the ~30 requests a
          # run makes.  That is a coin-flip flake on the ACME tests
          # (they fail with "JWS has an invalid anti-replay nonce"), so
          # turn the injector off: our tests assert the client's
          # behaviour, not the server's hostility.
          PEBBLE_WFE_NONCEREJECT: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # hashFiles includes every .rs file so source-only changes
          # (which cargo's incremental rebuild would otherwise pick
          # up correctly, but GHA's `target/` cache snapshot can mask
          # by feeding cargo a stale incremental state) bust the
          # cache. Cargo.lock / Cargo.toml alone are NOT enough —
          # they don't change when `src/proxy.rs` does, and we've
          # seen that lead to flakes where the running binary was
          # older than the source the test was written against.
          key: ${{ runner.os }}-cargo-e2e-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', '**/*.rs') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-1.96-

      - name: Add hosts entry for localhost.test
        run: echo "127.0.0.1 localhost.test" | sudo tee -a /etc/hosts

      - name: Run E2E tests
        # 15-minute hard cap. Local runs finish in ~7 min; a 60-min
        # hang (the previous run) means a tokio spawn is keeping
        # the test runtime alive, and the only way to recover is
        # to kill the step. `make test-e2e` builds release binaries
        # first, so we pad the budget to cover a cold cache (~10 min
        # build + ~5 min test).
        timeout-minutes: 15
        run: make test-e2e