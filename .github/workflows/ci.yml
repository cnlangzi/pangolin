name: CI

on:
  pull_request:
    branches: [main]

# Cancel in-progress runs when the same PR gets a new push.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ----------------------------------------------------------------
  # Lint: fmt + clippy + cargo test
  # ----------------------------------------------------------------
  lint:
    name: Lint (fmt + clippy + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.96-

      - name: make lint
        run: make lint

  # ----------------------------------------------------------------
  # Build: release compile of all binaries
  # ----------------------------------------------------------------
  build:
    name: Build (release compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-1.96-

      - name: make build
        run: make build

  # ----------------------------------------------------------------
  # Unit tests (no integration feature)
  # ----------------------------------------------------------------
  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-unit-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-unit-1.96-

      - name: Run unit tests
        run: cargo test --workspace

  # ----------------------------------------------------------------
  # E2E tests — requires Pebble ACME server
  # ----------------------------------------------------------------
  e2e:
    name: E2E tests (Pebble)
    runs-on: ubuntu-latest
    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        ports:
          - "14000:14000"
          - "5001:5001"
          - "15000:15000"
        env:
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_VA_ALWAYS_VALID: "1"
          PEBBLE_LISTEN: "0.0.0.0:14000"
          PEBBLE_WFE_OVERRIDE_DNS: "127.0.0.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-e2e-1.96-

      - name: Add hosts entry for localhost.test
        run: echo "127.0.0.1 localhost.test" | sudo tee -a /etc/hosts

      - name: Run E2E tests
        run: make test-e2e