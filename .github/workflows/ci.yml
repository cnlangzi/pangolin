name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ----------------------------------------------------------------
  # Rust build + unit tests
  # All steps reuse Makefile targets so local and CI stay in sync.
  # ----------------------------------------------------------------
  rust:
    name: Rust build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Runs: fmt --check + clippy -D warnings + test
      - name: make lint
        run: make lint

      - name: make build
        run: make build

  # ----------------------------------------------------------------
  # Integration tests — ACME with Pebble (letsencrypt/pebble:latest)
  # Runs only when integration feature is available (on PR and branch pushes).
  # ----------------------------------------------------------------
  integration:
    name: ACME integration tests (Pebble)
    runs-on: ubuntu-latest
    services:
      pebble:
        image: ghcr.io/letsencrypt/pebble:latest
        container-name: pebble
        ports:
          - "14000:14000"   # ACME endpoint
          - "5001:5001"     # pebble-challtestsrv (not used but exposed)
          - "15000:15000"   # pebble-challtestsrv alt port
        env:
          PEBBLE_VA_NOSLEEP: "1"
          PEBBLE_VA_ALWAYS_VALID: "1"
          PEBBLE_LISTEN: "0.0.0.0:14000"
          PEBBLE_WFE_OVERRIDE_DNS: "127.0.0.1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-integration-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-integration-

      # Resolve localhost.test → 127.0.0.1 so Pebble VA can reach the challenge server.
      - name: Add hosts entry for localhost.test
        run: echo "127.0.0.1 localhost.test" | sudo tee -a /etc/hosts

      # make test-integration runs: cargo test --workspace --features integration
      - name: make test-integration
        run: make test-integration