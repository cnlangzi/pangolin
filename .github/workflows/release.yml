name: Release

on:
  push:
    tags:
      - 'v*'

# Default to read-only. Only the publishing job needs to write, and
# the build job runs third-party code (the workspace's build scripts,
# the vendored OpenSSL, the tailwindcss/esbuild CLIs that
# `make build` downloads and executes) — a write-scoped token in that
# job would let a compromised dependency push commits or tags.
permissions:
  contents: read

# One release per tag. `cancel-in-progress: false` on purpose:
# cancelling mid-publish can leave a half-uploaded release behind.
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ----------------------------------------------------------------
  # Build: native compile of the release binaries
  #
  # Native — not the Docker pipeline in build/docker/dist.dockerfile —
  # for two reasons:
  #
  #   - the published binary is compiled by the same Rust 1.96 that
  #     .github/workflows/ci.yml tests, while the Docker pipeline
  #     compiles with rustc 1.98.1, a version no CI job ever runs;
  #   - ubuntu-22.04 ships glibc 2.35, which starts on the Debian 12
  #     (glibc 2.36) production hosts, while ubuntu-latest (24.04,
  #     glibc 2.39) produces binaries that die there with
  #     `GLIBC_2.38 not found`. The openssl-sys dependency is cgo, so
  #     those symbol versions are really recorded in the binary.
  #
  # `make build` (not a bare `cargo build`) is what ships the admin
  # UI: it depends on `build-css`, which regenerates the minified
  # `assets/app.css` that rust-embed snapshots into the binary.
  # ----------------------------------------------------------------
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # `include:` only — adding a target later is one new entry.
        # `ubuntu-22.04-arm` is the same 22.04 image line as
        # `ubuntu-22.04`, so the arm64 build lands on the same glibc
        # 2.35 floor — natively compiled, no cross toolchain.
        include:
          - target: linux/amd64
            slug: linux-amd64
            runs-on: ubuntu-22.04
          - target: linux/arm64
            slug: linux-arm64
            runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the ancestry check below needs origin/main.
          # `persist-credentials: false` keeps the (read-only) token
          # out of .git/config — this job never pushes.
          fetch-depth: 0
          persist-credentials: false

      - name: Install native build dependencies
        # libz-ng-sys compiles C through cmake, openssl-sys is cgo and
        # needs the OpenSSL headers pkg-config points at.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libssl-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          # The runner label is part of the key: `runner.os` is
          # `Linux` for every ubuntu image, so a target/ tree built
          # on ubuntu-latest (glibc 2.39) would otherwise be restored
          # here and shipped as a binary that refuses to start on the
          # glibc 2.36 production hosts.
          key: ${{ runner.os }}-${{ matrix.runs-on }}-cargo-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.runs-on }}-cargo-1.96-

      - name: Validate the tag
        id: version
        # The tag comes in through the environment, never spliced
        # into the script: a ref name may contain `"`, `;` or `$(…)`,
        # and this job holds a token.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::tag '$tag' does not match v<semver>"
            exit 1
          fi
          tag_version="${BASH_REMATCH[1]}"

          # The shape check above is looser than semver: it accepts
          # `v1.2.3-01`, `v1.2.3-.` and `v1.2.3-a..b`, all of which
          # cargo rejects ("invalid leading zero in pre-release
          # identifier", "empty identifier segment in pre-release
          # identifier"). The version is written into Cargo.toml and
          # parsed by cargo, so a tag cargo cannot parse has to fail
          # here — before the build — and not three steps later.
          #
          # This is the semver.org pattern in the POSIX ERE that
          # bash's `=~` speaks: no non-capturing groups, and a
          # pre-release identifier is either a number without a
          # leading zero or something carrying a letter or a hyphen.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag_version" =~ $semver ]]; then
            echo "::error::tag '$tag' is not a version cargo can parse"
            exit 1
          fi

          echo "tag $tag is a valid release tag (version $tag_version)"
          # The release version is the tag verbatim — the leading `v`
          # stays, so tag, archive name and `--version` all read the
          # same way.
          echo "release_version=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Assert the tagged commit is on main
        run: |
          set -euo pipefail
          # The release procedure is "merge to main, then tag". This
          # workflow runs no tests, so the tag is the operator's
          # promise that the commit was through CI — enforce the
          # "on main" half of it before spending a build on it.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::the tagged commit $(git rev-parse --short HEAD) is not on origin/main — merge to main before tagging"
            exit 1
          fi
          echo "tagged commit $(git rev-parse --short HEAD) is on main"

      - name: Assert the dashboard key is not the development placeholder
        # The dashboard's Ed25519 public key is compiled into the
        # binary (issue #185). The repository ships a DEVELOPMENT
        # placeholder whose private half lives in
        # `tests/fixtures/` — the end-to-end suite needs it to sign a
        # request — so it must never reach a release.
        #
        # The other build jobs compile the same source, so this one
        # check is enough to stop the whole release.
        run: |
          set -euo pipefail
          key_file=crates/api/src/dashboard.pub
          placeholder=439a24963d8250a37a685231546de534176238a9b43e7e1ce23c48d01b3795ea
          key=$(grep -v '^[[:space:]]*#' "$key_file" | tr -d '[:space:]')
          if [[ "$key" == "$placeholder" ]]; then
            echo "::error::$key_file still holds the development key — replace it (and tests/fixtures/dashboard_dev_seed.hex) with the production key pair before tagging"
            exit 1
          fi
          echo "the dashboard key is not the development placeholder"

      - name: Set the workspace version from the tag
        # The tag is the single source of truth for the release
        # version. The repository carries the placeholder 0.0.0 in
        # `[workspace.package]`, and this step writes the tag's
        # version into it before the build — so the operator never has
        # to bump a version by hand before tagging.
        #
        # One manifest line moves every version string in the binaries:
        # `--version`, `/healthz`, the startup log and both User-Agent
        # strings all read CARGO_PKG_VERSION, which every workspace
        # member inherits from this line.
        #
        # The write happens *after* the cargo cache step on purpose:
        # the cache key hashes `**/Cargo.toml`, so rewriting the
        # manifest first would give every release a unique key and
        # force a cold build (a cold `make build` of this tree —
        # vendored OpenSSL included — takes ~26 min on 4 cores).
        env:
          TAG_VERSION: ${{ steps.version.outputs.tag_version }}
        run: |
          set -euo pipefail
          # The tag version has already passed the semver regex, so it
          # holds only digits, letters, `.`, `+` and `-` — safe to
          # splice into the awk program below.
          #
          # One lookup, two jobs: `write` replaces the version,
          # `read` prints it. Two separate programs would have to
          # agree on what `[workspace.package]` means; one cannot
          # drift from itself.
          #
          # The lookup is scoped to the table — a global substitution
          # would also hit the `version = "…"` keys under
          # [workspace.dependencies] and break the build — and it
          # replaces the *quoted value* only, so a comment trailing
          # the version survives the rewrite.
          workspace_package_version() {
            awk -v mode="$1" -v ver="$TAG_VERSION" '
              /^\[/ { inpkg = 0 }
              /^\[workspace\.package\][[:space:]]*(#.*)?$/ { inpkg = 1 }
              inpkg && /^[[:space:]]*version[[:space:]]*=/ {
                if (!match($0, /"[^"]*"/)) { if (mode == "write") print; next }
                if (mode == "read") { print substr($0, RSTART + 1, RLENGTH - 2); exit }
                print substr($0, 1, RSTART - 1) "\"" ver "\"" substr($0, RSTART + RLENGTH)
                next
              }
              mode == "write" { print }
            ' Cargo.toml
          }

          workspace_package_version write > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

          # Read the value back with the same lookup and compare it:
          # a rewrite that silently did not take effect must fail the
          # job before the build, not after it.
          workspace_version="$(workspace_package_version read)"
          if [ -z "$workspace_version" ]; then
            echo "::error::could not read [workspace.package].version from Cargo.toml — expected $TAG_VERSION"
            exit 1
          fi
          if [ "$workspace_version" != "$TAG_VERSION" ]; then
            echo "::error::could not set [workspace.package].version in Cargo.toml to $TAG_VERSION (found '$workspace_version')"
            exit 1
          fi
          echo "[workspace.package].version is now $workspace_version"

      - name: make build
        run: make build

      - name: Assert the binaries exist and report the release version
        env:
          TAG_VERSION: ${{ steps.version.outputs.tag_version }}
        run: |
          set -euo pipefail
          for bin in bin/pangolin-ngx bin/pangolin-tun; do
            if [ ! -x "$bin" ]; then
              echo "::error::$bin is missing or not executable after 'make build'"
              exit 1
            fi
            version="$("$bin" --version)"
            echo "$bin --version → $version"
            if [[ "$version" != *"v$TAG_VERSION"* ]]; then
              echo "::error::$bin reports '$version', expected it to contain 'v$TAG_VERSION'"
              exit 1
            fi
          done

      - name: Stage and archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          suffix="$TARGET"
          suffix="${suffix//\//_}"
          # Absolute paths: `tar -C` switches the directory it reads
          # the member names from, and the archive itself must not
          # follow it.
          stage="$PWD/dist/stage"
          mkdir -p "$stage"
          install -m 0755 bin/pangolin-ngx "$stage/pangolin-ngx"
          install -m 0755 bin/pangolin-tun "$stage/pangolin-tun"
          # The configuration files are the repository's own — the same
          # bytes `make start-ngx` / `make start-tun` read, so there is
          # exactly one copy of each in the world.
          #
          # 0600, not the source's 0644: `tun.yml` carries the tun's
          # bearer token and `ngx.yml` the admin password, and both
          # files say so themselves. `install` rather than `cp` so the
          # mode in the archive is the one the operator wants.
          install -m 0600 ngx.yml "$stage/ngx.yml"
          install -m 0600 tun.yml "$stage/tun.yml"
          # The four files sit at the archive root — no wrapping
          # directory, no path prefix.
          tar -C "$stage" -czf "$PWD/dist/pangolin_${RELEASE_VERSION}_${suffix}.tar.gz" \
            pangolin-ngx pangolin-tun ngx.yml tun.yml
          # Read the two configuration files back *out of the archive*
          # and compare them with the repository's. This is the check
          # that proves the archive carries them, unchanged, under the
          # names the operator will find — diffing the staged copies
          # would be a tautology, they are `install`s of the very
          # files next to them.
          tar -xzOf "$PWD/dist/pangolin_${RELEASE_VERSION}_${suffix}.tar.gz" ngx.yml \
            | diff - ngx.yml
          tar -xzOf "$PWD/dist/pangolin_${RELEASE_VERSION}_${suffix}.tar.gz" tun.yml \
            | diff - tun.yml
          tar -tzf "$PWD/dist/pangolin_${RELEASE_VERSION}_${suffix}.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: pangolin-${{ matrix.slug }}
          path: dist/pangolin_*.tar.gz
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Build-mac: macOS binaries (arm64 native, x64 cross-compiled)
  #
  # macos-15 is an Apple Silicon runner. The x64 build is a cross
  # compile (`--target x86_64-apple-darwin`) on the same runner —
  # clang is natively multi-arch, so no second (paid, deprecated)
  # Intel runner is needed.
  #
  # OpenSSL is vendored — compiled from source via openssl-src —
  # here and on every other platform: pingora-openssl enables the
  # `vendored` feature by default, so no pangolin binary links a
  # system OpenSSL. The explicit `--features openssl/vendored` on
  # the cargo command keeps that guarantee if pingora-openssl ever
  # drops it. Vendored is what makes the x64 cross compile work at
  # all: the runner's Homebrew `openssl@3` is arm64-only and could
  # not serve the cross link, while openssl-src builds for whatever
  # `--target` says.
  #
  # The full `make build` is not used: it accepts neither
  # `--features` nor `--target`. Its CSS half (`make build-css`)
  # runs as-is — `download-ui-tools` already handles both darwin
  # architectures — and the cargo invocation runs directly after it,
  # so rust-embed still snapshots a minified `assets/app.css`.
  # ----------------------------------------------------------------
  build-mac:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    # Vendored OpenSSL is a cold ~26 min compile on 4 cores (see the
    # `build` job's stamping comment); macOS runners have fewer.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `cargo-target` empty = native compile on the runner's arch.
        include:
          - target: macos/arm64
            slug: macos-arm64
            runs-on: macos-15
            cargo-target: ''
          - target: macos/x64
            slug: macos-x64
            runs-on: macos-15
            cargo-target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the ancestry check below needs origin/main.
          # `persist-credentials: false` keeps the (read-only) token
          # out of .git/config — this job never pushes.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Add the cross target
        if: matrix.cargo-target != ''
        run: rustup target add ${{ matrix.cargo-target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          # Same key shape as the `build` job, plus `cargo-target`:
          # `target/<triple>/` keeps the two builds' outputs apart on
          # disk, and the key keeps their cache snapshots apart too.
          key: ${{ runner.os }}-${{ matrix.runs-on }}-${{ matrix.cargo-target }}-cargo-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.runs-on }}-${{ matrix.cargo-target }}-cargo-1.96-

      # The tag validation, on-main assertion and version stamping
      # below are verbatim copies of the `build` job's steps — keep
      # them in sync. They are copied, not extracted into a composite
      # action, so each job reads top-to-bottom on its own.
      - name: Validate the tag
        id: version
        # The tag comes in through the environment, never spliced
        # into the script: a ref name may contain `"`, `;` or `$(…)`,
        # and this job holds a token.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::tag '$tag' does not match v<semver>"
            exit 1
          fi
          tag_version="${BASH_REMATCH[1]}"

          # The shape check above is looser than semver: it accepts
          # `v1.2.3-01`, `v1.2.3-.` and `v1.2.3-a..b`, all of which
          # cargo rejects ("invalid leading zero in pre-release
          # identifier", "empty identifier segment in pre-release
          # identifier"). The version is written into Cargo.toml and
          # parsed by cargo, so a tag cargo cannot parse has to fail
          # here — before the build — and not three steps later.
          #
          # This is the semver.org pattern in the POSIX ERE that
          # bash's `=~` speaks: no non-capturing groups, and a
          # pre-release identifier is either a number without a
          # leading zero or something carrying a letter or a hyphen.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag_version" =~ $semver ]]; then
            echo "::error::tag '$tag' is not a version cargo can parse"
            exit 1
          fi

          echo "tag $tag is a valid release tag (version $tag_version)"
          # The release version is the tag verbatim — the leading `v`
          # stays, so tag, archive name and `--version` all read the
          # same way.
          echo "release_version=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Assert the tagged commit is on main
        run: |
          set -euo pipefail
          # The release procedure is "merge to main, then tag". This
          # workflow runs no tests, so the tag is the operator's
          # promise that the commit was through CI — enforce the
          # "on main" half of it before spending a build on it.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::the tagged commit $(git rev-parse --short HEAD) is not on origin/main — merge to main before tagging"
            exit 1
          fi
          echo "tagged commit $(git rev-parse --short HEAD) is on main"

      - name: Set the workspace version from the tag
        # The tag is the single source of truth for the release
        # version. See the `build` job for the full comment — this is
        # the same table-scoped rewrite, read back and compared so a
        # silent no-op fails the job before the build.
        #
        # The write happens *after* the cargo cache step on purpose:
        # the cache key hashes `**/Cargo.toml`, so rewriting the
        # manifest first would give every release a unique key and
        # force a cold build.
        env:
          TAG_VERSION: ${{ steps.version.outputs.tag_version }}
        run: |
          set -euo pipefail
          # The tag version has already passed the semver regex, so it
          # holds only digits, letters, `.`, `+` and `-` — safe to
          # splice into the awk program below.
          #
          # One lookup, two jobs: `write` replaces the version,
          # `read` prints it. Two separate programs would have to
          # agree on what `[workspace.package]` means; one cannot
          # drift from itself.
          #
          # The lookup is scoped to the table — a global substitution
          # would also hit the `version = "…"` keys under
          # [workspace.dependencies] and break the build — and it
          # replaces the *quoted value* only, so a comment trailing
          # the version survives the rewrite.
          workspace_package_version() {
            awk -v mode="$1" -v ver="$TAG_VERSION" '
              /^\[/ { inpkg = 0 }
              /^\[workspace\.package\][[:space:]]*(#.*)?$/ { inpkg = 1 }
              inpkg && /^[[:space:]]*version[[:space:]]*=/ {
                if (!match($0, /"[^"]*"/)) { if (mode == "write") print; next }
                if (mode == "read") { print substr($0, RSTART + 1, RLENGTH - 2); exit }
                print substr($0, 1, RSTART - 1) "\"" ver "\"" substr($0, RSTART + RLENGTH)
                next
              }
              mode == "write" { print }
            ' Cargo.toml
          }

          workspace_package_version write > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

          # Read the value back with the same lookup and compare it:
          # a rewrite that silently did not take effect must fail the
          # job before the build, not after it.
          workspace_version="$(workspace_package_version read)"
          if [ -z "$workspace_version" ]; then
            echo "::error::could not read [workspace.package].version from Cargo.toml — expected $TAG_VERSION"
            exit 1
          fi
          if [ "$workspace_version" != "$TAG_VERSION" ]; then
            echo "::error::could not set [workspace.package].version in Cargo.toml to $TAG_VERSION (found '$workspace_version')"
            exit 1
          fi
          echo "[workspace.package].version is now $workspace_version"

      - name: make build-css
        # The CSS half of `make build`: regenerates the minified
        # `assets/app.css` that rust-embed snapshots into the binary,
        # so the admin UI is styled. `download-ui-tools` fetches the
        # darwin-arm64 tailwindcss CLI on this runner.
        run: make build-css

      - name: cargo build (vendored OpenSSL)
        env:
          CARGO_TARGET: ${{ matrix.cargo-target }}
        run: |
          set -euo pipefail
          args=(--release -p ngx -p tun --features openssl/vendored)
          if [ -n "$CARGO_TARGET" ]; then
            args+=(--target "$CARGO_TARGET")
          fi
          cargo build "${args[@]}"

      - name: Assert the binaries exist and report the release version
        env:
          TAG_VERSION: ${{ steps.version.outputs.tag_version }}
          CARGO_TARGET: ${{ matrix.cargo-target }}
        run: |
          set -euo pipefail
          bindir="target/release"
          if [ -n "$CARGO_TARGET" ]; then
            bindir="target/$CARGO_TARGET/release"
          fi
          # A cross-built x86_64 binary runs under Rosetta 2. The
          # macos-15 image ships it; should it ever be absent, degrade
          # to a non-empty-file check — the five executable targets
          # share this stamping script and prove the version is right.
          run=""
          if [ -n "$CARGO_TARGET" ]; then
            if arch -x86_64 /usr/bin/true 2>/dev/null; then
              run="arch -x86_64"
            else
              echo "Rosetta 2 unavailable — degrading to file checks"
              for bin in "$bindir/ngx" "$bindir/tun"; do
                if [ ! -s "$bin" ]; then
                  echo "::error::$bin is missing or empty after the build"
                  exit 1
                fi
              done
              exit 0
            fi
          fi
          for bin in "$bindir/ngx" "$bindir/tun"; do
            if [ ! -x "$bin" ]; then
              echo "::error::$bin is missing or not executable after the build"
              exit 1
            fi
            # Deliberately unquoted $run: empty on the native entry,
            # `arch -x86_64` on the cross one.
            version="$($run "$bin" --version)"
            echo "$bin --version → $version"
            if [[ "$version" != *"v$TAG_VERSION"* ]]; then
              echo "::error::$bin reports '$version', expected it to contain 'v$TAG_VERSION'"
              exit 1
            fi
          done

      - name: Stage and archive
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          TARGET: ${{ matrix.target }}
          CARGO_TARGET: ${{ matrix.cargo-target }}
        run: |
          set -euo pipefail
          bindir="target/release"
          if [ -n "$CARGO_TARGET" ]; then
            bindir="target/$CARGO_TARGET/release"
          fi
          suffix="$TARGET"
          suffix="${suffix//\//_}"
          # Absolute paths: `tar -C` switches the directory it reads
          # the member names from, and the archive itself must not
          # follow it.
          stage="$PWD/dist/stage"
          mkdir -p "$stage"
          install -m 0755 "$bindir/ngx" "$stage/pangolin-ngx"
          install -m 0755 "$bindir/tun" "$stage/pangolin-tun"
          # The configuration files are the repository's own — the same
          # bytes `make start-ngx` / `make start-tun` read, so there is
          # exactly one copy of each in the world.
          #
          # 0600, not the source's 0644: `tun.yml` carries the tun's
          # bearer token and `ngx.yml` the admin password, and both
          # files say so themselves. `install` rather than `cp` so the
          # mode in the archive is the one the operator wants.
          install -m 0600 ngx.yml "$stage/ngx.yml"
          install -m 0600 tun.yml "$stage/tun.yml"
          # The four files sit at the archive root — no wrapping
          # directory, no path prefix.
          tar -C "$stage" -czf "$PWD/dist/pangolin_${RELEASE_VERSION}_${suffix}.tar.gz" \
            pangolin-ngx pangolin-tun ngx.yml tun.yml
          # Read the two configuration files back *out of the archive*
          # and compare them with the repository's. This is the check
          # that proves the archive carries them, unchanged, under the
          # names the operator will find — diffing the staged copies
          # would be a tautology, they are `install`s of the very
          # files next to them.
          tar -xzOf "$PWD/dist/pangolin_${RELEASE_VERSION}_${suffix}.tar.gz" ngx.yml \
            | diff - ngx.yml
          tar -xzOf "$PWD/dist/pangolin_${RELEASE_VERSION}_${suffix}.tar.gz" tun.yml \
            | diff - tun.yml
          tar -tzf "$PWD/dist/pangolin_${RELEASE_VERSION}_${suffix}.tar.gz"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: pangolin-${{ matrix.slug }}
          path: dist/pangolin_*.tar.gz
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Build-tun: Windows binaries (tun only — no ngx)
  #
  # There is no Windows ngx: pingora 0.9 needs Unix-only APIs (Unix
  # sockets, daemonize, systemd socket activation) and `crates/ngx` carries
  # `#[cfg(unix)]` code of its own — that is a port, not a matrix
  # entry. The Windows archive therefore holds exactly
  # `pangolin-tun.exe` + `tun.yml` (no `ngx.yml`, it would be dead
  # configuration), zipped per Windows convention rather than
  # tar.gz.
  #
  # windows/arm64 is a cross compile (`--target
  # aarch64-pc-windows-msvc`) on the x64 runner — there is no public
  # Windows-on-ARM runner. ring (via quinn/rustls) compiles its C
  # with clang-cl, which the runner image ships, and links against
  # the MSVC ARM64 libraries, an optional VS2022 component the probe
  # step installs when missing. The resulting binary cannot execute
  # on an x64 runner, so it gets no `--version` assertion — a
  # non-empty binary plus the archive read-back is the check, and
  # the executable targets share this stamping script and prove the
  # version is right.
  #
  # No `make` here either: the Windows image has no GNU make, tun
  # has no CSS dependency, and `make build` accepts no `--target` —
  # so the cargo invocation runs directly.
  # ----------------------------------------------------------------
  build-tun:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # `cargo-target` empty = native compile on the runner's arch.
        include:
          - target: windows/amd64
            slug: windows-amd64
            runs-on: windows-latest
            cargo-target: ''
          - target: windows/arm64
            slug: windows-arm64
            runs-on: windows-latest
            cargo-target: aarch64-pc-windows-msvc
    steps:
      # A CRLF checkout would put CRLF `tun.yml` bytes into the zip
      # and fail the read-back diff against the repository's LF file.
      # Must run before actions/checkout clones the repository.
      - name: Keep LF line endings in the checkout
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v5
        with:
          # Full history: the ancestry check below needs origin/main.
          # `persist-credentials: false` keeps the (read-only) token
          # out of .git/config — this job never pushes.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96

      - name: Add the cross target
        if: matrix.cargo-target != ''
        run: rustup target add ${{ matrix.cargo-target }}

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          # Same key shape as the `build` job, plus `cargo-target`:
          # `target/<triple>/` keeps the two builds' outputs apart on
          # disk, and the key keeps their cache snapshots apart too.
          key: ${{ runner.os }}-${{ matrix.runs-on }}-${{ matrix.cargo-target }}-cargo-1.96-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.runs-on }}-${{ matrix.cargo-target }}-cargo-1.96-

      # The tag validation, on-main assertion and version stamping
      # below are verbatim copies of the `build` job's steps — keep
      # them in sync. They run under Git Bash (`shell: bash`; the
      # Windows default is pwsh, which cannot parse them) and are
      # copied, not extracted into a composite action, so each job
      # reads top-to-bottom on its own.
      - name: Validate the tag
        id: version
        shell: bash
        # The tag comes in through the environment, never spliced
        # into the script: a ref name may contain `"`, `;` or `$(…)`,
        # and this job holds a token.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::tag '$tag' does not match v<semver>"
            exit 1
          fi
          tag_version="${BASH_REMATCH[1]}"

          # The shape check above is looser than semver: it accepts
          # `v1.2.3-01`, `v1.2.3-.` and `v1.2.3-a..b`, all of which
          # cargo rejects ("invalid leading zero in pre-release
          # identifier", "empty identifier segment in pre-release
          # identifier"). The version is written into Cargo.toml and
          # parsed by cargo, so a tag cargo cannot parse has to fail
          # here — before the build — and not three steps later.
          #
          # This is the semver.org pattern in the POSIX ERE that
          # bash's `=~` speaks: no non-capturing groups, and a
          # pre-release identifier is either a number without a
          # leading zero or something carrying a letter or a hyphen.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$tag_version" =~ $semver ]]; then
            echo "::error::tag '$tag' is not a version cargo can parse"
            exit 1
          fi

          echo "tag $tag is a valid release tag (version $tag_version)"
          # The release version is the tag verbatim — the leading `v`
          # stays, so tag, archive name and `--version` all read the
          # same way.
          echo "release_version=$tag" >> "$GITHUB_OUTPUT"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"

      - name: Assert the tagged commit is on main
        shell: bash
        run: |
          set -euo pipefail
          # The release procedure is "merge to main, then tag". This
          # workflow runs no tests, so the tag is the operator's
          # promise that the commit was through CI — enforce the
          # "on main" half of it before spending a build on it.
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::the tagged commit $(git rev-parse --short HEAD) is not on origin/main — merge to main before tagging"
            exit 1
          fi
          echo "tagged commit $(git rev-parse --short HEAD) is on main"

      - name: Set the workspace version from the tag
        shell: bash
        # The tag is the single source of truth for the release
        # version. See the `build` job for the full comment — this is
        # the same table-scoped rewrite, read back and compared so a
        # silent no-op fails the job before the build.
        #
        # The write happens *after* the cargo cache step on purpose:
        # the cache key hashes `**/Cargo.toml`, so rewriting the
        # manifest first would give every release a unique key and
        # force a cold build.
        env:
          TAG_VERSION: ${{ steps.version.outputs.tag_version }}
        run: |
          set -euo pipefail
          # The tag version has already passed the semver regex, so it
          # holds only digits, letters, `.`, `+` and `-` — safe to
          # splice into the awk program below.
          #
          # One lookup, two jobs: `write` replaces the version,
          # `read` prints it. Two separate programs would have to
          # agree on what `[workspace.package]` means; one cannot
          # drift from itself.
          #
          # The lookup is scoped to the table — a global substitution
          # would also hit the `version = "…"` keys under
          # [workspace.dependencies] and break the build — and it
          # replaces the *quoted value* only, so a comment trailing
          # the version survives the rewrite.
          workspace_package_version() {
            awk -v mode="$1" -v ver="$TAG_VERSION" '
              /^\[/ { inpkg = 0 }
              /^\[workspace\.package\][[:space:]]*(#.*)?$/ { inpkg = 1 }
              inpkg && /^[[:space:]]*version[[:space:]]*=/ {
                if (!match($0, /"[^"]*"/)) { if (mode == "write") print; next }
                if (mode == "read") { print substr($0, RSTART + 1, RLENGTH - 2); exit }
                print substr($0, 1, RSTART - 1) "\"" ver "\"" substr($0, RSTART + RLENGTH)
                next
              }
              mode == "write" { print }
            ' Cargo.toml
          }

          workspace_package_version write > Cargo.toml.tmp
          mv Cargo.toml.tmp Cargo.toml

          # Read the value back with the same lookup and compare it:
          # a rewrite that silently did not take effect must fail the
          # job before the build, not after it.
          workspace_version="$(workspace_package_version read)"
          if [ -z "$workspace_version" ]; then
            echo "::error::could not read [workspace.package].version from Cargo.toml — expected $TAG_VERSION"
            exit 1
          fi
          if [ "$workspace_version" != "$TAG_VERSION" ]; then
            echo "::error::could not set [workspace.package].version in Cargo.toml to $TAG_VERSION (found '$workspace_version')"
            exit 1
          fi
          echo "[workspace.package].version is now $workspace_version"

      - name: Ensure the MSVC ARM64 build tools are installed
        if: matrix.cargo-target == 'aarch64-pc-windows-msvc'
        shell: pwsh
        # ring (via quinn/rustls) compiles C for
        # aarch64-pc-windows-msvc with clang-cl — the runner image
        # ships LLVM — and links with the MSVC ARM64 libraries, which
        # are the optional `VC.Tools.ARM64` component of VS2022.
        # Probe with vswhere; install only when missing (the current
        # windows-latest image ships it, so this is usually a no-op).
        # A byte-for-byte copy of this probe lives in the smoke-cross
        # job of .github/workflows/ci.yml — keep the two in sync.
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer"
          $vswhere = "$installer\vswhere.exe"
          $have = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.ARM64 -property installationPath
          if ($have) {
            Write-Output "MSVC ARM64 build tools already installed at $have"
          } else {
            $vsPath = & $vswhere -latest -products * -property installationPath
            Write-Output "Installing Microsoft.VisualStudio.Component.VC.Tools.ARM64 into $vsPath"
            & "$installer\vs_installer.exe" modify `
              --installPath "$vsPath" `
              --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
              --quiet --norestart --wait
            if ($LASTEXITCODE -ne 0) { throw "vs_installer modify failed with exit code $LASTEXITCODE" }
          }
          # ring's build script looks clang-cl / llvm-lib up on PATH;
          # the runner image ships LLVM here.
          Write-Output "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH

      - name: cargo build
        shell: bash
        env:
          CARGO_TARGET: ${{ matrix.cargo-target }}
        run: |
          set -euo pipefail
          args=(--release -p tun)
          if [ -n "$CARGO_TARGET" ]; then
            args+=(--target "$CARGO_TARGET")
          fi
          cargo build "${args[@]}"

      - name: Assert the binary exists and (when executable) reports the release version
        shell: bash
        env:
          TAG_VERSION: ${{ steps.version.outputs.tag_version }}
          CARGO_TARGET: ${{ matrix.cargo-target }}
        run: |
          set -euo pipefail
          bindir="target/release"
          if [ -n "$CARGO_TARGET" ]; then
            bindir="target/$CARGO_TARGET/release"
          fi
          bin="$bindir/tun.exe"
          if [ ! -s "$bin" ]; then
            echo "::error::$bin is missing or empty after the build"
            exit 1
          fi
          if [ -n "$CARGO_TARGET" ]; then
            # An aarch64 binary cannot run on the x64 runner — the
            # non-empty check above plus the archive read-back below
            # is all there is. The executable targets share this
            # stamping script and prove the version is right.
            echo "$bin built (cross target — not executable on this runner)"
            exit 0
          fi
          version="$("./$bin" --version)"
          echo "$bin --version → $version"
          if [[ "$version" != *"v$TAG_VERSION"* ]]; then
            echo "::error::$bin reports '$version', expected it to contain 'v$TAG_VERSION'"
            exit 1
          fi

      - name: Stage and archive
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.release_version }}
          TARGET: ${{ matrix.target }}
          CARGO_TARGET: ${{ matrix.cargo-target }}
        run: |
          set -euo pipefail
          bindir="target/release"
          if [ -n "$CARGO_TARGET" ]; then
            bindir="target/$CARGO_TARGET/release"
          fi
          suffix="$TARGET"
          suffix="${suffix//\//_}"
          stage="$PWD/dist/stage"
          mkdir -p "$stage"
          cp "$bindir/tun.exe" "$stage/pangolin-tun.exe"
          # The configuration file is the repository's own — the same
          # bytes `make start-tun` reads. No `install -m`: a zip
          # carries no permission bits, so the 0755/0600 convention of
          # the tar.gz archives does not apply here.
          cp tun.yml "$stage/tun.yml"
          archive="$PWD/dist/pangolin_${RELEASE_VERSION}_${suffix}.zip"
          # The zip is written and read back with the bsdtar that
          # ships in the Windows image (System32 tar.exe) — `-a`
          # picks the zip format from the suffix. Git Bash's own tar
          # is GNU tar, which can neither write nor read zip, so the
          # System32 one is named explicitly. cygpath hands it
          # Windows paths: bsdtar does not understand Git Bash's
          # `/c/...` mounts.
          bsdtar() { "/c/Windows/System32/tar.exe" "$@"; }
          win_archive="$(cygpath -w "$archive")"
          win_stage="$(cygpath -w "$stage")"
          bsdtar -a -cf "$win_archive" -C "$win_stage" pangolin-tun.exe tun.yml
          # Read the configuration back *out of the archive* and
          # compare it with the repository's — the same proof the
          # tar.gz jobs run: the archive carries tun.yml, unchanged,
          # under the name the operator will find.
          bsdtar -xOf "$win_archive" tun.yml | diff - tun.yml
          bsdtar -tf "$win_archive"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: pangolin-${{ matrix.slug }}
          path: dist/pangolin_*.zip
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Package: turn the Linux binaries into deb / rpm packages
  #
  # One job per architecture, on the *native* runner of that
  # architecture.  The native runner is not an accident: the glibc
  # floor of the package is measured with `objdump -T`, and Ubuntu's
  # binutils only knows the architecture it was built for — objdump
  # on an arm64 binary on an amd64 runner says "File format not
  # recognized", and the floor would have to be guessed.  Guessing it
  # wrong keeps the package off a host that could run it, or lets it
  # onto a host that cannot.
  #
  # The job has read-only permissions: it runs third-party code (the
  # nfpm binary) and must not be able to push anything.
  # ----------------------------------------------------------------
  package:
    name: Package (${{ matrix.target }})
    # The binaries come out of the `build` job's artifact; the
    # download below only sees artifacts of *completed* jobs.
    needs: [build]
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            slug: linux-amd64
            runs-on: ubuntu-22.04
            arch: amd64
            rpm-arch: x86_64
            nfpm-platform: x86_64
          - target: linux/arm64
            slug: linux-arm64
            runs-on: ubuntu-22.04-arm
            arch: arm64
            rpm-arch: aarch64
            nfpm-platform: arm64
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install the packaging tools
        # binutils for `objdump`, which reads the glibc symbol
        # versions out of the binary.
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils

      - name: Install nfpm
        # The version is pinned: the package layout, the conffile
        # handling and the dependency syntax all come from nfpm's
        # schema, and an unpinned tool would change the artefacts
        # without anybody noticing.
        env:
          NFPM_VERSION: 2.49.0
          NFPM_PLATFORM: ${{ matrix.nfpm-platform }}
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_${NFPM_PLATFORM}.tar.gz"
          tar -xzf /tmp/nfpm.tar.gz -C /tmp nfpm
          sudo install -m 0755 /tmp/nfpm /usr/local/bin/nfpm
          nfpm --version

      - uses: actions/download-artifact@v7
        with:
          name: pangolin-${{ matrix.slug }}
          path: dist

      - name: Unpack the release binaries
        run: |
          set -euo pipefail
          mkdir -p bin
          tar -xzf dist/pangolin_*.tar.gz -C bin
          ls -l bin

      - name: Build the packages
        # The tag is the version — the same rule the release job
        # follows.  `build-packages.sh` turns `v1.2.3-rc1` into the
        # package version `1.2.3~rc1-1`, which sorts *before* the
        # release it precedes.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sh packaging/build-packages.sh \
            --tag-version "${TAG#v}" \
            --arch "${{ matrix.arch }}" \
            --rpm-arch "${{ matrix.rpm-arch }}" \
            --bin-dir bin \
            --out-dir dist/packages

      - name: Upload the packages
        uses: actions/upload-artifact@v6
        with:
          name: pangolin-packages-${{ matrix.slug }}
          path: dist/packages/*
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Release: publish the archives + checksums to the GitHub Release
  # of the pushed tag. No tests run here — the operator tags a commit
  # whose CI run on `main` was already green.
  # ----------------------------------------------------------------
  release:
    name: Publish GitHub Release
    # All three build jobs plus the packaging job. A failed platform
    # fails its `needs` entry, so this job never runs — a tag can
    # never publish a release that silently misses a platform.
    needs: [build, build-mac, build-tun, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this job publishes, so only this job needs to write.
    permissions:
      contents: write
    steps:
      # The release carries three assets that are not build outputs:
      # the one-line installer and the two systemd units.  The units
      # are the repository's own files — `deploy/playbooks/roles/*/files/`
      # is the single source and the release copies them, so the two
      # cannot drift apart.
      #
      # The checkout runs BEFORE the artefact download: `actions/checkout`
      # cleans the workspace by default, and a `git clean` after the
      # download would throw the archives away.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Stage the installer and the systemd units
        run: |
          set -euo pipefail
          install -m 0755 install.sh dist/install.sh
          install -m 0644 deploy/playbooks/roles/ngx/files/ngx.service dist/pangolin-ngx.service
          install -m 0644 deploy/playbooks/roles/tun/files/tun.service dist/pangolin-tun.service
          ls -l dist

      - name: Generate checksums
        working-directory: dist
        run: |
          set -euo pipefail
          # Running inside dist/ is what keeps the recorded paths
          # relative, so `sha256sum -c SHA256SUMS.txt` works from the
          # directory holding the archives.
          sha256sum pangolin_*.tar.gz pangolin_*.zip \
            install.sh pangolin-ngx.service pangolin-tun.service \
            *.deb *.rpm > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/install.sh
            dist/pangolin-ngx.service
            dist/pangolin-tun.service
            dist/SHA256SUMS.txt

  # ----------------------------------------------------------------
  # Deploy-repo: publish the apt / rpm repository
  #
  # The site tree lives on the `gh-pages` branch, which GitHub Pages
  # serves ("Deploy from a branch" → `gh-pages` → root).  The branch
  # is a *generated artefact*: every release replaces the whole tree,
  # so a hand-made commit on it is overwritten by the next release.
  #
  # This is the only job that holds the archive key.  The key is
  # imported here, used to sign the repository metadata, and gone
  # again when the job ends.  It is a separate job from the release
  # on purpose: a failed branch push turns this tag's CI red and can
  # be re-run on its own, without marking the Release that already
  # succeeded as failed.
  # ----------------------------------------------------------------
  deploy-repo:
    name: Publish the package repository
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    # Two releases must not push the branch at the same time: the
    # second one would overwrite the first one's tree halfway
    # through.  `cancel-in-progress: false` keeps a push that is
    # already running from being cancelled.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    env:
      GNUPGHOME: ${{ github.workspace }}/.gnupg
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history: the branch is pushed from here, and the
          # push is guarded by `--force-with-lease`, which compares
          # the remote against what the fetch saw.
          #
          # The credentials stay in the git config — this job pushes
          # the branch, and `persist-credentials: false` would leave
          # `git push` with no way to authenticate.  The token is
          # already least-privilege (`contents: write`, and nothing
          # else), and the job runs the repository's own scripts.
          fetch-depth: 0

      - name: Install the repository tools
        # dpkg-dev for `dpkg-scanpackages`, createrepo-c for the rpm
        # metadata, rpm for the package signatures, gnupg2 for the
        # `gpg2` binary rpm's gpg macro points at.
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev createrepo-c rpm gnupg2

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Import the archive signing key
        env:
          PANGOLIN_REPO_SIGNING_KEY: ${{ secrets.PANGOLIN_REPO_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "$GNUPGHOME"
          chmod 700 "$GNUPGHOME"
          # The secret holds the armored private key, base64-encoded
          # so that it survives the secret store's line handling.
          printf '%s' "$PANGOLIN_REPO_SIGNING_KEY" | base64 -d > "$GNUPGHOME/archive-key.asc"
          gpg --batch --import "$GNUPGHOME/archive-key.asc"
          # The imported copy is removed again: the keyring keeps the
          # key, and the file on disk would be a second copy of the
          # private key.
          rm -f "$GNUPGHOME/archive-key.asc"
          gpg --list-secret-keys

      - name: Build and sign the repository
        env:
          PANGOLIN_SIGNING_PASSPHRASE: ${{ secrets.PANGOLIN_REPO_SIGNING_PASSPHRASE }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sh packaging/publish-repo.sh \
            --site site \
            --deb-dir dist \
            --rpm-dir dist \
            --version "${TAG#v}" \
            --sign

      - name: Replace the site tree and push it
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The branch holds the *previous* site tree; it is replaced
          # wholesale, not merged into.  The history keeps the older
          # trees, and the release assets keep the older packages.
          branch_exists=0
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            git fetch origin gh-pages
            git checkout -B gh-pages origin/gh-pages
            branch_exists=1
          else
            git checkout --orphan gh-pages
          fi

          # Everything but `.git` goes: the tree is the generated
          # site, not the repository.
          find . -mindepth 1 -maxdepth 1 -not -name .git -not -name site -exec rm -rf {} +
          cp -a site/. .
          rm -rf site

          git add -A -f
          git commit -m "chore(release): publish the package repository for ${GITHUB_REF_NAME}"
          if [ "$branch_exists" -eq 1 ]; then
            # `--force-with-lease` refuses the push when somebody else
            # pushed to the branch in the meantime.
            git push --force-with-lease origin HEAD:gh-pages
          else
            git push origin HEAD:gh-pages
          fi
